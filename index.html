/* Direction : une copie double — grands carreaux Seyès en fond, marge rouge, compte à rebours écrit au stylo bleu. */
:root {
  --papier: #f6f8fc;
  --feuille: #ffffff;
  --encre: #18233f;
  --encre-2: #4c5875;
  --encre-3: #66718c;
  --ligne: #e4eaf5;
  --ligne-forte: #cfd9ec;
  --marge: #ee95a4;
  --bic: #1f4fd8;
  --sur-bic: #ffffff;
  --bic-doux: #e9effd;
  --rouge: #c8243a;
  --rouge-doux: #fdecef;
  --vert: #1e7a4c;
  --vert-doux: #e6f4ec;
  --orange: #a65e00;
  --orange-doux: #fdf1dc;
  --ombre: 0 1px 0 rgba(24, 35, 63, .04), 0 10px 28px -18px rgba(24, 35, 63, .35);

  /* graphiques (palette validée) */
  --s-ses: #2a78d6; --s-hggsp: #eb6834; --s-philo: #1baf7a;
  --barre: #2a78d6; --barre-part: #86b6ef;
  --tk1: #ec9979; --tk2: #db754b; --tk3: #c5521c; --tk4: #a43700; --tk5: #7d2600;
  --st-bon: #0ca30c; --st-moyen: #fab219; --st-faible: #d03b3b; --st-aucun: #c3cad8;
  --grille: #e6eaf2; --axe: #c6cddb;

  --f-display: "Kalam", "Segoe Print", "Bradley Hand", cursive;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-xs: .8125rem; --t-s: .875rem; --t-m: 1rem; --t-l: 1.1875rem; --t-xl: 1.5rem; --t-xxl: 2.125rem;
  --r: 14px; --r-s: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #0c1220; --feuille: #141d31; --encre: #e6ecf8; --encre-2: #b5bfd5; --encre-3: #929db6;

    --ombre: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
    --s-ses: #3987e5; --s-hggsp: #d95926; --s-philo: #199e70;
    --barre: #5598e7; --barre-part: #1f5cab;
    --tk1: #824121; --tk2: #ae5528; --tk3: #d86d38; --tk4: #f19266; --tk5: #ffbc9d;

    color-scheme: dark;
  }
}

  --papier: #0c1220; --feuille: #141d31; --encre: #e6ecf8; --encre-2: #b5bfd5; --encre-3: #929db6;
  --ligne: #172036; --ligne-forte: #26324d; --marge: #6e2f3d;
  --bic: #7fa2ff; --sur-bic: #0c1220; --bic-doux: #1b2848;
  --rouge: #ff7a88; --rouge-doux: #3a1a24; --vert: #4cc38a; --vert-doux: #14301f; --orange: #f0a040; --orange-doux: #35270f;
  --ombre: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
  --s-ses: #3987e5; --s-hggsp: #d95926; --s-philo: #199e70;
  --barre: #5598e7; --barre-part: #1f5cab;
  --tk1: #824121; --tk2: #ae5528; --tk3: #d86d38; --tk4: #f19266; --tk5: #ffbc9d;
  --st-aucun: #3a4560; --grille: #1f2940; --axe: #334061;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--f-body);
  font-size: var(--t-m);
  line-height: 1.45;
  color: var(--encre);
  background-color: var(--papier);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne-forte) 31px 32px),
    repeating-linear-gradient(to bottom, transparent 0 7px, var(--ligne) 7px 8px),
    repeating-linear-gradient(to right, transparent 0 31px, var(--ligne) 31px 32px);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}
.marge-rouge { position: fixed; top: 0; bottom: 0; left: 9px; width: 2px; background: var(--marge); opacity: .75; pointer-events: none; z-index: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--bic); }
:focus-visible { outline: 3px solid var(--bic); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Coquille ---------- */
.app { position: relative; z-index: 1; min-height: 100%; }
.main { padding: 18px 16px 104px 22px; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--feuille) 94%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--ligne-forte);
  padding: 6px 6px 8px;
}
.nav a {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-decoration: none; color: var(--encre-2); font-size: var(--t-xs); padding: 6px 2px; border-radius: 10px;
}
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--bic); font-weight: 700; background: var(--bic-doux); }
.nav .marque { display: none; }

@media (min-width: 960px) {
  .marge-rouge { left: 236px; }
  .nav {
    top: 0; bottom: 0; right: auto; width: 228px; display: flex; flex-direction: column; gap: 4px;
    border-top: 0; border-right: 1px solid var(--ligne-forte); padding: 22px 14px;
    background: var(--feuille);
  }
  .nav .marque { display: block; font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; color: var(--bic); padding: 0 10px 18px; line-height: 1.1; }
  .nav .marque small { display: block; font-family: var(--f-body); font-weight: 400; font-size: var(--t-xs); color: var(--encre-2); margin-top: 4px; }
  .nav a { flex-direction: row; gap: 12px; font-size: var(--t-m); padding: 10px 12px; }
  .main { margin-left: 260px; margin-right: auto; max-width: 1120px; padding: 32px 32px 48px; width: calc(100% - 260px); }
}

/* ---------- Éléments ---------- */
.carte {
  background: var(--feuille); border: 1px solid var(--ligne-forte); border-radius: var(--r);
  box-shadow: var(--ombre); padding: 16px;
}
.carte > * + * { margin-top: 12px; }
.carte-titre { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.carte-titre h2, .h2 { font-size: var(--t-l); font-weight: 700; }
.sous { color: var(--encre-2); font-size: var(--t-s); }
.petit { font-size: var(--t-xs); color: var(--encre-2); }
.page-titre { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.page-titre h1 { font-size: var(--t-xxl); font-family: var(--f-display); font-weight: 700; color: var(--encre); line-height: 1.05; }
.page-titre p { color: var(--encre-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); color: var(--encre); font-weight: 700; cursor: pointer; text-align: center;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:hover { background: var(--bic-doux); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primaire { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }
.btn.primaire:hover { filter: brightness(1.06); }
.btn.grand { min-height: 56px; font-size: var(--t-l); border-radius: 14px; width: 100%; }
.btn.fantome { background: transparent; border-color: transparent; color: var(--bic); }
.btn.fantome:hover { background: var(--bic-doux); }
.btn.danger { color: var(--rouge); }
.btn.ok { background: var(--vert); border-color: var(--vert); color: #fff; }
:root[data-theme="dark"] .btn.ok { color: #0c1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok { color: #0c1220; } }
.btn.non { color: var(--rouge); border-color: color-mix(in srgb, var(--rouge) 45%, var(--ligne-forte)); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.petit-btn { min-height: 36px; padding: 6px 12px; font-size: var(--t-s); }
.rangee { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rangee.etire > * { flex: 1 1 0; }
.pile { display: flex; flex-direction: column; gap: 10px; }

.puce {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: var(--t-xs); font-weight: 700; border: 1px solid var(--ligne-forte); background: var(--feuille); color: var(--encre-2);
  white-space: nowrap;
}
.puce.bic { background: var(--bic-doux); color: var(--bic); border-color: transparent; }
.puce.bac { background: var(--bic); color: var(--sur-bic); border-color: transparent; }
.puce.hors { background: transparent; color: var(--encre-3); border-style: dashed; }
.puce .pt { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.puces { display: flex; gap: 8px; flex-wrap: wrap; }

.choix { display: flex; flex-wrap: wrap; gap: 8px; }
.choix button {
  min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); cursor: pointer; font-size: var(--t-s); font-weight: 700; color: var(--encre-2);
}
.choix button[aria-pressed="true"] { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }

.bandeau { border-radius: var(--r-s); padding: 10px 14px; font-size: var(--t-s); display: flex; gap: 10px; align-items: flex-start; }
.bandeau svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.bandeau.info { background: var(--bic-doux); color: var(--encre); }
.bandeau.alerte { background: var(--orange-doux); color: var(--encre); }
.bandeau.erreur { background: var(--rouge-doux); color: var(--encre); }

label.champ { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: var(--t-s); }
label.champ .aide { font-weight: 400; color: var(--encre-2); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); color: var(--encre);
}
textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
textarea.copie {
  min-height: 260px; padding: 12px 14px 12px 22px; line-height: 32px;
  background-image: linear-gradient(to right, transparent 12px, var(--marge) 12px 14px, transparent 14px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne-forte) 31px 32px);
  background-attachment: local;
}
.case { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.case input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--bic); }

/* ---------- Ce soir ---------- */
.entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.date-du-jour { font-size: var(--t-s); color: var(--encre-2); }
.date-du-jour::first-letter, .journal .jd::first-letter { text-transform: uppercase; }
.salut { font-size: var(--t-xl); font-weight: 700; }
.etat-sync { font-size: var(--t-xs); color: var(--encre-3); display: inline-flex; align-items: center; gap: 6px; }
.etat-sync .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--st-aucun); }
.etat-sync.ok .pt { background: var(--st-bon); }
.etat-sync.lent .pt { background: var(--st-moyen); }

.hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 4px 0 0; }
.compte {
  font-family: var(--f-display); font-weight: 700; color: var(--bic);
  font-size: clamp(3.6rem, 17vw, 5.6rem); line-height: .95; letter-spacing: -.01em;
  transform: rotate(-2deg); transform-origin: left bottom; display: inline-block;
}
.compte-sous { color: var(--encre-2); font-size: var(--t-s); margin-top: 6px; }
.compte-sous strong { color: var(--encre); }
.trait { display: block; height: 10px; width: min(220px, 70%); margin-top: 2px; }
.anneau { position: relative; width: 128px; height: 128px; }
.anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anneau .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.anneau .val b { font-size: 1.75rem; line-height: 1; }
.anneau .val span { font-size: var(--t-xs); color: var(--encre-2); }

.semaine { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.semaine .j { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--t-xs); color: var(--encre-2); }
.semaine .rond { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ligne-forte); background: var(--feuille); }
.semaine .rond.part { background: linear-gradient(to top, var(--barre-part) 50%, var(--feuille) 50%); border-color: var(--barre-part); }
.semaine .rond.plein { background: var(--barre); border-color: var(--barre); }
.semaine .j.auj .rond { outline: 2px solid var(--bic); outline-offset: 2px; }
.serie { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--t-s); color: var(--encre-2); }
.serie b { color: var(--encre); font-size: var(--t-l); }

.mot { border-left: 4px solid var(--marge); background: var(--feuille); }
.mot .mot-txt { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.35; color: var(--encre); white-space: pre-wrap; }

.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--ligne-forte); }
.plan li:first-child { border-top: 0; }
.plan .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--bic-doux); color: var(--bic); display: grid; place-items: center; }
.plan .ico svg { width: 20px; height: 20px; }
.plan .lbl b { display: block; }
.plan .lbl span { font-size: var(--t-s); color: var(--encre-2); }
.plan .min { font-weight: 700; color: var(--encre-2); font-size: var(--t-s); }
.plan li.fait .lbl b { text-decoration: line-through; text-decoration-color: var(--rouge); }

.raccourcis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.raccourci { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px; min-height: 76px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; }
.raccourci:hover { background: var(--bic-doux); }
.raccourci svg { width: 22px; height: 22px; color: var(--bic); }
.raccourci b { font-size: var(--t-s); }
.raccourci span { font-size: var(--t-xs); color: var(--encre-2); }

/* ---------- Réviser ---------- */
.methodes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 700px) { .methodes { grid-template-columns: repeat(3, 1fr); } }
.methode { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--ligne-forte); background: var(--feuille); box-shadow: var(--ombre); cursor: pointer; min-height: 128px; }
.methode:hover { border-color: var(--bic); }
.methode .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bic-doux); color: var(--bic); }
.methode .ico svg { width: 22px; height: 22px; }
.methode b { font-size: var(--t-m); }
.methode span { font-size: var(--t-xs); color: var(--encre-2); }
.methode .meta { margin-top: auto; font-weight: 700; color: var(--bic); font-size: var(--t-xs); }

.liste-chap { display: flex; flex-direction: column; }
.liste-chap .groupe { font-size: var(--t-xs); font-weight: 700; color: var(--encre-3); text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 6px; }
.chap { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--ligne); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.chap:hover { background: var(--bic-doux); }
.chap .t { font-weight: 700; font-size: var(--t-s); }
.chap .s { font-size: var(--t-xs); color: var(--encre-2); }
.maitrise { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 700; color: var(--encre-2); white-space: nowrap; }
.maitrise .pt { width: 12px; height: 12px; border-radius: 4px; background: var(--st-aucun); flex: none; }
.maitrise.m1 .pt { background: var(--st-faible); }
.maitrise.m2 .pt { background: var(--st-moyen); }
.maitrise.m3 .pt { background: var(--st-bon); }
.jauge { height: 6px; border-radius: 3px; background: var(--ligne); overflow: hidden; width: 64px; }
.jauge i { display: block; height: 100%; background: var(--barre); border-radius: 3px; }

.segment { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.segment button { min-height: 52px; border-radius: 10px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; font-size: var(--t-xs); font-weight: 700; color: var(--encre-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px; }
.segment button .pt { width: 12px; height: 12px; border-radius: 4px; background: var(--st-aucun); }
.segment button[data-m="1"] .pt { background: var(--st-faible); }
.segment button[data-m="2"] .pt { background: var(--st-moyen); }
.segment button[data-m="3"] .pt { background: var(--st-bon); }
.segment button[aria-pressed="true"] { border-color: var(--bic); box-shadow: inset 0 0 0 2px var(--bic); color: var(--encre); }

/* ---------- Feuille (overlay) ---------- */
.voile { position: fixed; inset: 0; background: rgba(12, 18, 32, .45); z-index: 40; display: flex; align-items: stretch; justify-content: center; }
.feuille {
  position: relative; background: var(--papier); width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne) 31px 32px);
}
@media (min-width: 760px) {
  .voile { align-items: center; padding: 24px; }
  .feuille { max-width: 760px; height: auto; max-height: calc(100% - 48px); border-radius: 18px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.5); }
}
.feuille-tete { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--ligne-forte); background: var(--feuille); }
.feuille-tete h2 { font-size: var(--t-l); flex: 1; }
.feuille-tete .fermer { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; display: grid; place-items: center; }
.feuille-tete .fermer svg { width: 20px; height: 20px; }
.feuille-corps { overflow-y: auto; padding: 18px 16px 32px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.feuille-pied { padding: 12px 16px; border-top: 1px solid var(--ligne-forte); background: var(--feuille); display: flex; gap: 10px; flex-wrap: wrap; }
.feuille-pied > .btn { flex: 1 1 140px; }
.chrono-barre { display: flex; align-items: center; gap: 12px; padding: 8px 20px; background: var(--feuille); border-bottom: 1px solid var(--ligne); font-size: var(--t-s); }
.chrono-barre .temps { font-weight: 700; font-variant-numeric: tabular-nums; }
.chrono-barre .barre { flex: 1; height: 8px; border-radius: 4px; background: var(--ligne); overflow: hidden; }
.chrono-barre .barre i { display: block; height: 100%; background: var(--bic); border-radius: 4px; transition: width .5s linear; }
.etapes { display: flex; gap: 6px; flex-wrap: wrap; }
.etapes span { font-size: var(--t-xs); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--ligne-forte); color: var(--encre-2); background: var(--feuille); }
.etapes span.encours { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }
.etapes span.fini { text-decoration: line-through; }

/* cartes mémoire */
.flash { min-height: 230px; display: flex; flex-direction: column; gap: 14px; justify-content: center; padding: 22px 18px; border-radius: 16px; background: var(--feuille); border: 1px solid var(--ligne-forte); box-shadow: var(--ombre); }
.flash .q { font-size: 1.45rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.flash .r { font-size: var(--t-m); line-height: 1.55; border-top: 1px dashed var(--ligne-forte); padding-top: 14px; }
.compteur { display: flex; justify-content: space-between; font-size: var(--t-s); color: var(--encre-2); }

.sujet { background: var(--feuille); border: 1px solid var(--ligne-forte); border-left: 4px solid var(--marge); border-radius: 12px; padding: 14px 16px; }
.sujet .t { font-size: var(--t-l); font-weight: 700; line-height: 1.3; }
details.repli { border: 1px solid var(--ligne-forte); border-radius: 12px; background: var(--feuille); padding: 0 14px; }
details.repli summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
details.repli[open] { padding-bottom: 12px; }
details.repli ol, details.repli ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.retour { display: flex; flex-direction: column; gap: 12px; }
.retour .note { font-family: var(--f-display); font-weight: 700; color: var(--rouge); font-size: 2.6rem; line-height: 1; transform: rotate(-4deg); display: inline-block; }
.retour h3 { font-size: var(--t-m); }
.retour ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.qcm { display: flex; flex-direction: column; gap: 8px; }
.qcm button { text-align: left; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; line-height: 1.4; }
.qcm button.bon { border-color: var(--vert); background: var(--vert-doux); }
.qcm button.mauvais { border-color: var(--rouge); background: var(--rouge-doux); }

.minuteur { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 0; }
.minuteur .grand-anneau { width: min(260px, 70vw); aspect-ratio: 1; position: relative; }
.minuteur .grand-anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.minuteur .grand-anneau .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }

/* tampon de fin */
.tampon-zone { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0 8px; text-align: center; }
.tampon {
  font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--rouge);
  border: 4px solid var(--rouge); border-radius: 12px; padding: 8px 18px; font-size: 1.9rem; transform: rotate(-9deg);
  animation: tamponner .45s cubic-bezier(.2, 1.4, .4, 1) both;
}
.tampon.bleu { color: var(--bic); border-color: var(--bic); }
@keyframes tamponner { from { transform: rotate(-9deg) scale(1.8); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tampon { animation: none; } .btn { transition: none; } .chrono-barre .barre i { transition: none; } }

/* dialogue interne */
.dialogue-voile { position: fixed; inset: 0; z-index: 60; background: rgba(12,18,32,.55); display: grid; place-items: center; padding: 20px; }

.tuile { background: var(--feuille); border: 1px solid var(--ligne-forte); border-radius: var(--r); padding: 14px; box-shadow: var(--ombre); display: flex; flex-direction: column; gap: 4px; }

.legende .kl { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }

      ["Productivité globale des facteurs (PGF)", "Part de la croissance qui ne s’explique pas par l’augmentation des quantités de travail et de capital. Elle traduit surtout le progrès technique (le « résidu » de Solow)."],
      ["Croissance endogène", "Théorie (Romer, Lucas, Barro) : le progrès technique naît des investissements en recherche, en capital humain et en infrastructures. Il s’auto-entretient grâce aux externalités positives."],
      ["Destruction créatrice (Schumpeter)", "Les innovations font disparaître des produits, des entreprises et des emplois anciens tout en en créant de nouveaux. C’est le moteur du capitalisme selon Schumpeter."],
      ["Institutions et droits de propriété", "Les institutions sont les règles qui encadrent l’activité économique. Des droits de propriété protégés (dont les brevets) incitent à investir et à innover, car l’innovateur peut tirer profit de son innovation."],
      ["Progrès technique et inégalités", "Le progrès technique favorise souvent les travailleurs qualifiés, dont la demande et les salaires augmentent : il peut creuser les inégalités de revenus. Il crée aussi des rentes temporaires pour les innovateurs."],
      ["Limites écologiques de la croissance", "Épuisement des ressources, pollutions, réchauffement climatique. Soutenabilité faible : le capital naturel peut être remplacé par du capital technique. Soutenabilité forte : il doit être préservé."],
      ["Innovation et limites écologiques", "L’innovation peut faire reculer ces limites : énergies renouvelables, efficacité énergétique, recyclage. Limite : l’effet rebond (on consomme plus quand c’est plus efficace)."]
    ],
    sujets: [
      { type: "ec1", texte: "Montrez que le progrès technique peut être source d’inégalités de revenus." },
      { type: "dissert", texte: "Dans quelle mesure l’innovation permet-elle une croissance économique soutenable ?" }
    ] },
  { id: "ses-commerce", mat: "ses", groupe: "Science économique", bac: true, court: "Commerce international",
    titre: "Quels sont les fondements du commerce international et de l’internationalisation de la production ?",
    cartes: [
      ["Avantage comparatif (Ricardo)", "Un pays a intérêt à se spécialiser dans les productions où il est relativement le plus efficace (ou le moins inefficace), même sans aucun avantage absolu, puis à échanger le reste."],
      ["Dotations factorielles (modèle HOS)", "Un pays se spécialise dans les productions qui utilisent intensément le facteur dont il est relativement le mieux doté : travail peu qualifié, travail qualifié, capital, ressources naturelles."],
      ["Dotations technologiques", "Une avance technologique (innovation, savoir-faire) permet à un pays d’exporter des produits que les autres ne savent pas produire aussi bien."],
      ["Commerce entre pays comparables", "Il s’explique par la différenciation des produits (variétés, marques, qualité) et le goût des consommateurs pour la diversité. C’est souvent un commerce intra-branche."],
      ["Différenciation horizontale / verticale", "Horizontale : même niveau de qualité, caractéristiques différentes (style, couleur). Verticale : niveaux de qualité différents (gamme)."],
      ["Productivité des firmes et exportations", "Seules les entreprises les plus productives d’un territoire parviennent à exporter, car exporter coûte cher au départ (réseaux, adaptation des produits, logistique)."],
      ["Chaîne de valeur mondiale", "La production est découpée en étapes (conception, composants, assemblage, distribution) réparties dans plusieurs pays, chacune là où elle est la plus avantageuse. Exemple : un smartphone."],
      ["Firme multinationale (FMN)", "Entreprise qui possède au moins une unité de production à l’étranger, créée ou rachetée grâce à un investissement direct à l’étranger (IDE)."],
      ["Effets du commerce international", "Gains : prix plus bas, plus de variété, rattrapage des pays en développement (moins d’inégalités entre pays). Mais hausse possible des inégalités au sein des pays (perdants : salariés peu qualifiés des secteurs concurrencés)."],
      ["Libre-échange et protectionnisme", "Libre-échange : suppression des obstacles aux échanges. Protectionnisme : droits de douane, quotas, normes, subventions pour protéger les producteurs nationaux (ex. industries naissantes). Risque : représailles des partenaires."]
    ],
    sujets: [
      { type: "ec1", texte: "Montrez que la productivité des entreprises conditionne leur capacité à exporter." },
      { type: "dissert", texte: "Le commerce international n’a-t-il que des effets positifs ?" }
    ] },
  { id: "ses-chomage", mat: "ses", groupe: "Science économique", bac: true, court: "Chômage",
    titre: "Comment lutter contre le chômage ?",
    cartes: [
      ["Chômeur au sens du BIT", "Personne de 15 ans ou plus qui, une semaine donnée, n’a pas travaillé (même une heure), est disponible pour travailler dans les 15 jours et a cherché activement un emploi dans le mois précédent (ou en a trouvé un qui commence dans les 3 mois)."],
      ["Taux de chômage / taux d’emploi", "Taux de chômage = chômeurs ÷ population active × 100. Taux d’emploi = personnes en emploi ÷ population en âge de travailler (15-64 ans) × 100."],
      ["Sous-emploi", "Personnes qui ont un emploi mais travaillent moins qu’elles le souhaitent : temps partiel subi, chômage technique ou partiel."],
      ["Halo autour du chômage", "Personnes sans emploi qui souhaitent travailler mais ne sont pas comptées comme chômeurs (pas disponibles tout de suite, ou qui ne cherchent pas activement)."],
      ["Chômage structurel", "Chômage durable qui ne dépend pas de la conjoncture : il vient du fonctionnement du marché du travail (institutions, asymétries d’information, problèmes d’appariement)."],
      ["Chômage conjoncturel", "Chômage dû à un ralentissement de l’activité : la demande globale baisse, les entreprises produisent moins et réduisent leurs embauches."],
      ["Salaire d’efficience", "Salaire plus élevé que le salaire d’équilibre, versé pour motiver, fidéliser et attirer les meilleurs salariés, car l’employeur ne peut pas observer parfaitement leurs efforts (asymétrie d’information). Il peut créer du chômage."],
      ["Institutions et chômage", "Salaire minimum et règles de protection de l’emploi protègent les salariés, mais peuvent, selon certains économistes, freiner l’embauche des moins qualifiés. Leur effet réel fait débat."],
      ["Problèmes d’appariement", "Offres et demandes de travail se rencontrent mal : qualifications qui ne correspondent pas, emplois loin des chômeurs, information imparfaite. Il y a alors à la fois des chômeurs et des postes vacants."],
      ["Politiques contre le chômage", "Contre le chômage conjoncturel : soutien de la demande globale (politiques budgétaire et monétaire). Contre le chômage structurel : baisse du coût du travail, formation, flexibilisation du marché du travail."]
    ],
    sujets: [
      { type: "ec1", texte: "Montrez que les asymétries d’information sur le marché du travail peuvent être à l’origine de chômage structurel." },
      { type: "dissert", texte: "Quelles politiques permettent de lutter efficacement contre le chômage ?" }
    ] },
  { id: "ses-crises", mat: "ses", groupe: "Science économique", bac: false, court: "Crises financières",
    titre: "Comment expliquer les crises financières et réguler le système financier ?",
    cartes: [
      ["Crise financière", "Chute brutale du prix des actifs (actions, immobilier), faillites d’institutions financières et paniques. Exemples : krach de 1929, crise des subprimes de 2008."],
      ["Bulle spéculative", "Hausse du prix d’un actif bien au-delà de sa valeur réelle, entretenue par ceux qui achètent en espérant une nouvelle hausse. Elle finit par éclater (krach)."],
      ["Panique bancaire", "Les déposants, craignant la faillite de leur banque, retirent tous leur argent en même temps, ce qui peut provoquer cette faillite."],
      ["Effet de richesse négatif", "Quand le prix de leurs actifs baisse, les ménages se sentent moins riches et réduisent leur consommation, ce qui ralentit l’économie."],
      ["Aléa moral", "Un acteur qui se sait protégé prend plus de risques. Exemple : une grande banque qui compte être sauvée par l’État si elle fait faillite."],
      ["Régulation du système financier", "Supervision des banques, exigences de fonds propres (accords de Bâle), banque centrale prêteur en dernier ressort, union bancaire européenne."]
    ],
    sujets: [
      { type: "ec1", texte: "Montrez que les paniques bancaires peuvent transformer une crise financière en crise économique." }
    ] },
  { id: "ses-europe", mat: "ses", groupe: "Science économique", bac: true, court: "Politiques européennes",
    titre: "Quelles politiques économiques dans le cadre européen ?",
    cartes: [
      ["Marché unique européen", "Espace sans frontières intérieures où circulent librement marchandises, services, capitaux et personnes (prévu par l’Acte unique de 1986, en place depuis 1993)."],
      ["Zone euro", "Pays de l’Union européenne qui ont adopté l’euro (créé en 1999, pièces et billets en 2002). Leur politique monétaire est menée par la Banque centrale européenne (BCE)."],
      ["Politique européenne de la concurrence", "Menée par la Commission européenne : elle sanctionne les ententes et les abus de position dominante, contrôle les fusions et les aides d’État, pour des prix bas, de la qualité et de l’innovation."],
      ["Limites de la politique de la concurrence", "Elle peut empêcher l’émergence de « champions européens » capables de rivaliser avec les géants américains et chinois, et freiner les politiques industrielles."],
      ["Politique monétaire de la BCE", "La BCE fixe ses taux directeurs pour maintenir la stabilité des prix (inflation proche de 2 % à moyen terme). Baisser les taux encourage le crédit, l’investissement et la consommation."],
      ["Politique budgétaire", "Utilisation des dépenses et des recettes publiques pour agir sur l’activité : relance (plus de dépenses, moins d’impôts) ou rigueur. Dans l’UE, elle reste décidée par chaque État."],
      ["Choc asymétrique", "Choc qui touche un pays et pas les autres. La BCE ne peut pas y répondre (un seul taux pour toute la zone) : c’est à la politique budgétaire du pays touché d’agir."],
      ["Règles budgétaires européennes", "Pacte de stabilité et de croissance : déficit public limité à 3 % du PIB et dette publique à 60 % du PIB (règles réformées en 2024). Elles limitent la marge de relance des États."],
      ["Coordination des politiques budgétaires", "Sans coordination, un pays peut profiter de la relance des autres sans dépenser lui-même (passager clandestin). Exemple de coordination : le plan de relance NextGenerationEU (2020)."]
    ],
    sujets: [
      { type: "ec1", texte: "Montrez que la politique monétaire de la BCE peut agir sur la conjoncture." },
      { type: "dissert", texte: "La politique budgétaire est-elle efficace dans la zone euro ?" }
    ] },
  { id: "ses-structure", mat: "ses", groupe: "Sociologie et science politique", bac: true, court: "Structure sociale",
    titre: "Comment est structurée la société française actuelle ?",
    cartes: [
      ["PCS", "Professions et catégories socioprofessionnelles de l’Insee : classement selon le métier, le statut et la qualification. 6 groupes d’actifs : agriculteurs exploitants ; artisans, commerçants, chefs d’entreprise ; cadres ; professions intermédiaires ; employés ; ouvriers."],
      ["Facteurs de hiérarchisation de l’espace social", "PCS, revenu, diplôme, composition du ménage, position dans le cycle de vie (âge), sexe, lieu de résidence."],
      ["Évolutions de la structure socioprofessionnelle", "Depuis les années 1950 : salarisation, tertiarisation, élévation du niveau de qualification, féminisation des emplois. Moins d’agriculteurs et d’ouvriers, plus de cadres et de professions intermédiaires."],
      ["Classes sociales chez Marx", "Groupes définis par leur place dans les rapports de production : la bourgeoisie possède les moyens de production, le prolétariat vend sa force de travail. Classe en soi + conscience de classe = classe pour soi. Lutte des classes."],
      ["Stratification chez Weber", "Approche multidimensionnelle : ordre économique (classes, selon l’accès aux biens), ordre social (groupes de statut, selon le prestige), ordre politique (partis)."],
      ["Moyennisation", "Thèse d’Henri Mendras : une vaste classe moyenne s’est développée et les écarts se sont réduits pendant les Trente Glorieuses. Elle est discutée depuis la remontée des inégalités."],
      ["Arguments pour une lecture en classes", "Persistance des inégalités de revenus et de patrimoine, homogamie, reproduction sociale, forte conscience de classe de la grande bourgeoisie (travaux des Pinçon-Charlot)."],
      ["Arguments contre une lecture en classes", "Individualisation des parcours, affaiblissement de la conscience de classe ouvrière, poids d’autres critères (genre, âge, origine), identifications subjectives floues."],

    sujets: [
      { type: "ec1", texte: "Distinguez l’approche de Marx et celle de Weber de la stratification sociale." },
      { type: "dissert", texte: "Une analyse en termes de classes sociales est-elle encore pertinente pour rendre compte de la société française ?" }
    ] },
  { id: "ses-ecole", mat: "ses", groupe: "Sociologie et science politique", bac: false, court: "École",

    cartes: [
      ["Massification scolaire", "Hausse du nombre d’élèves et d’étudiants qui accèdent à des niveaux d’études de plus en plus élevés (environ 8 jeunes sur 10 d’une génération obtiennent aujourd’hui le bac)."],
      ["Démocratisation scolaire", "Réduction des inégalités d’accès aux diplômes selon l’origine sociale. Pierre Merle parle de démocratisation ségrégative quand tous progressent mais dans des filières inégales."],
      ["Capital culturel (Bourdieu)", "Ressources culturelles transmises par la famille (langage, savoirs, diplômes, rapport à la culture). Elles favorisent la réussite scolaire, car l’école valorise la culture des milieux favorisés."],
      ["Stratégies des familles (Boudon)", "Les familles font des choix d’orientation selon un calcul coûts/avantages qui dépend de leur position sociale : à résultats égaux, les familles populaires visent des études plus courtes."],
      ["Socialisation et parcours scolaires", "La socialisation familiale (lecture, suivi des devoirs, ambitions) et la socialisation genrée (orientations différentes des filles et des garçons) influencent les parcours."]

    sujets: [
      { type: "ec1", texte: "Montrez que le capital culturel contribue aux inégalités de réussite scolaire." }

  { id: "ses-mobilite", mat: "ses", groupe: "Sociologie et science politique", bac: true, court: "Mobilité sociale",
    titre: "Quels sont les caractéristiques contemporaines et les facteurs de la mobilité sociale ?",
    cartes: [
      ["Mobilité sociale intergénérationnelle", "Changement de position sociale d’un individu par rapport à celle de ses parents. À ne pas confondre avec la mobilité géographique ou professionnelle."],
      ["Mobilité intragénérationnelle", "Changement de position sociale d’un même individu au cours de sa vie active."],

  { id: "ses-travail", mat: "ses", groupe: "Sociologie et science politique", bac: true, court: "Travail et emploi",

    sujets: [

  { id: "ses-engagement", mat: "ses", groupe: "Sociologie et science politique", bac: true, court: "Engagement politique",
    titre: "Comment expliquer l’engagement politique dans les sociétés démocratiques ?",
    cartes: [
      ["Formes de l’engagement politique", "Vote, militantisme (parti, syndicat), engagement associatif, consommation engagée (boycott, buycott), manifestations, pétitions."],
      ["Paradoxe de l’action collective (Olson)", "Un individu rationnel a intérêt à ne pas participer (cela lui coûte) tout en profitant du résultat obtenu par les autres : c’est le comportement de passager clandestin."],

    sujets: [
      { type: "ec1", texte: "Montrez que les incitations sélectives permettent de dépasser le paradoxe de l’action collective." },
      { type: "dissert", texte: "Comment expliquer l’engagement politique dans les sociétés démocratiques ?" }
    ] },
  { id: "ses-justice", mat: "ses", groupe: "Regards croisés", bac: false, court: "Justice sociale",

    cartes: [

    cartes: [

      ["Acteurs de la question environnementale", "Pouvoirs publics, ONG, entreprises, experts (comme le GIEC), partis politiques, mouvements citoyens. Ils coopèrent mais entrent aussi en conflit."],

      ["Externalité négative", "Effet négatif de l’activité d’un agent sur d’autres, sans compensation monétaire (ex. pollution). Le marché ne la prend pas en compte : les pouvoirs publics doivent intervenir."],

      ["Marché de quotas d’émission", "Les pouvoirs publics fixent un plafond d’émissions et distribuent ou vendent des droits à polluer échangeables ; leur prix se fixe sur le marché. Limite : un prix trop bas n’incite pas."],

      const c = JSON.parse(localStorage.getItem(this.cleCache()) || "null");
      if (c && c.docs) {
        S.config = fusionConfig(c.config || {});
        for (const coll of COLLECTIONS) S[coll] = new Map((c.docs[coll] || []).map((d) => [d.id, d]));
        this.depuis = c.depuis || null;
      }
      const a = JSON.parse(localStorage.getItem(this.cleAttente()) || "[]");
      this.attente = Array.isArray(a) ? a : [];
    } catch (e) { this.attente = []; }
  },
  sauverCache() {
    try {
      const docs = {};
      for (const coll of COLLECTIONS) docs[coll] = [...S[coll].values()];
      localStorage.setItem(this.cleCache(), JSON.stringify({ config: S.config, docs, depuis: this.depuis }));
      localStorage.setItem(this.cleAttente(), JSON.stringify(this.attente));
    } catch (e) { /* stockage plein ou indisponible : la synchro en ligne continue */ }
  },
  async rpc(nom, args) {
    const r = await fetch(`${SUPABASE.url}/rest/v1/rpc/${nom}`, {
      method: "POST", headers: { apikey: SUPABASE.cle, "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(args)
    });
    if (!r.ok) {
      let msg = ""; try { const j = await r.json(); msg = j.message || ""; } catch (e) { /* ignoré */ }
      const err = new Error(msg || "HTTP " + r.status); err.status = r.status; throw err;
    }
    return r.json();
  },
  async synchroniser() {
    if (!CLE_CARNET || this.syncEnCours) return;
    this.syncEnCours = true;
    try {
      await this.vider();
      const depuis = this.depuis ? new Date(Date.parse(this.depuis) - 5000).toISOString() : null;
      const lignes = await this.rpc("carnet_lire", { p_cle: CLE_CARNET, p_depuis: depuis });
      const enAttente = new Set(this.attente.map((a) => a.coll + "/" + a.id));
      let max = this.depuis;
      for (const l of lignes) {
        if (!max || Date.parse(l.maj) > Date.parse(max)) max = l.maj;
        if (enAttente.has(l.coll + "/" + l.doc_id)) continue;
        if (l.coll === "app") { if (l.doc_id === "config") S.config = fusionConfig(l.supprime ? {} : l.data); continue; }
        if (!S[l.coll]) continue;
        if (l.supprime) S[l.coll].delete(l.doc_id); else S[l.coll].set(l.doc_id, Object.assign({ id: l.doc_id }, l.data));
      }
      this.depuis = max;
      this.derniereSync = Date.now();
      S.sync = this.attente.length ? "attente" : "ok";
      this.sauverCache();
    } catch (e) {
      S.sync = /introuvable/.test(e.message || "") ? "inconnu" : (e.status ? "erreur" : "horsligne");
    } finally {
      this.syncEnCours = false;
      planifierRendu();
    }
  },
  ecrire(coll, id, data) {
    const propre = JSON.parse(JSON.stringify(data));
    if (coll === "app") S.config = fusionConfig(propre);
    else S[coll].set(id, Object.assign({ id }, propre));
    this.attente = this.attente.filter((a) => !(a.coll === coll && a.id === id));
    this.attente.push({ op: "set", coll, id, data: propre });
    this.sauverCache(); planifierRendu();
    return this.vider();
  },
  supprimer(coll, id) {
    S[coll].delete(id);
    this.attente = this.attente.filter((a) => !(a.coll === coll && a.id === id));
    this.attente.push({ op: "del", coll, id });
    this.sauverCache(); planifierRendu();
    return this.vider();
  },
  vider() {
    if (!CLE_CARNET) return Promise.resolve();
    if (this.envoi) return this.envoi;
    this.envoi = (async () => {
      while (this.attente.length) {
        const a = this.attente[0];
        try {
          if (a.op === "set") await this.rpc("carnet_ecrire", { p_cle: CLE_CARNET, p_coll: a.coll, p_doc: a.id, p_data: a.data });
          else await this.rpc("carnet_supprimer", { p_cle: CLE_CARNET, p_coll: a.coll, p_doc: a.id });
          this.attente = this.attente.filter((x) => x !== a);
          this.sauverCache();
        } catch (e) {
          if (/introuvable/.test(e.message || "")) { S.sync = "inconnu"; break; }
          if (e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429) {
            this.attente = this.attente.filter((x) => x !== a); this.sauverCache();
            toast("Une modification n’a pas pu être enregistrée.");
            continue;
          }
          S.sync = e.status ? "erreur" : "horsligne";
          break;
        }
      }
      if (!this.attente.length && S.sync !== "inconnu") S.sync = "ok";
      planifierRendu();
    })().finally(() => { this.envoi = null; });
    return this.envoi;
  }
};
function fusionConfig(d) {

  Object.assign(c, d || {});

  c.mot = Object.assign({}, DEFAUTS.mot, (d && d.mot) || {});

}

const Dictee = { d: null, cible: null, apercu: null, etat: "idle", boutons: new Set() };

/* ---------- Chrono d’activité (pause quand on quitte l’appli) ---------- */
class Chrono {
  constructor() { this.acc = 0; this.t0 = null; this.sorties = 0; this.decroches = 0; this.cache = null; this.manuel = false; this.surRetour = null; this._vis = this._vis.bind(this); this.debut = Date.now(); }
  demarrer() { if (this.t0 == null) this.t0 = performance.now(); document.addEventListener("visibilitychange", this._vis); }
  pauser() { if (this.t0 != null) { this.acc += performance.now() - this.t0; this.t0 = null; } }
  reprendre() { if (this.t0 == null) this.t0 = performance.now(); }
  _vis() {
    if (document.hidden) {
      if (this.t0 != null && !this.manuel) { this.pauser(); this.cache = Date.now(); this.sorties++; }
    } else if (this.cache) {
      const absent = Date.now() - this.cache; this.cache = null; this.reprendre();
      if (absent >= 45000 && this.surRetour) this.surRetour(absent);
    }
  }
  crediter(ms) { this.acc += ms; }
  ms() { return this.acc + (this.t0 != null ? performance.now() - this.t0 : 0); }
  minutes() { return Math.round(this.ms() / 60000); }
  arreter() { this.pauser(); document.removeEventListener("visibilitychange", this._vis); }
}
async function demanderRetour(chrono, absentMs) {
  const min = Math.max(1, Math.round(absentMs / 60000));
  const v = await dialogue({
    titre: `Tu as quitté l’appli pendant ${pluriel(min, "minute")}`,
    texte: "Le chrono s’est mis en pause. C’était pour réviser (cahier, manuel, exercice sur papier) ?",
    boutons: [
      { label: "Oui, c’était du travail : compte ce temps", valeur: "travail", cls: "primaire" },
      { label: "Non, j’ai décroché", valeur: "decroche" }
    ]
  });
  if (v === "travail") chrono.crediter(absentMs);
  else chrono.decroches++;
}

function series() {
  const mpj = minutesParJour(); const obj = S.config.objectif;
  const auj = todayKey();
  let k = (mpj.get(auj) || 0) >= obj ? auj : addDays(auj, -1);
  let actuelle = 0;
  while ((mpj.get(k) || 0) >= obj) { actuelle++; k = addDays(k, -1); }
  const jours = [...mpj.entries()].filter(([, v]) => v >= obj).map(([d]) => d).sort();
  let record = 0, cur = 0, prev = null;
  for (const d of jours) { cur = prev && daysBetween(prev, d) === 1 ? cur + 1 : 1; record = Math.max(record, cur); prev = d; }
  return { actuelle, record: Math.max(record, actuelle) };
}

function poidsMatiere(mat) {
  if (mat === "ses" || mat === "hggsp") return 1;
  if (mat === "philo") return 0.6;
  if (mat === "go") { const mois = new Date().getMonth(); return (mois >= 2 && mois <= 5) ? 0.55 : 0.15; }

function classementChapitres() {
  const auj = todayKey(); const derMat = derniereMatiere();
  return CHAPITRES.filter((c) => epreuveActive(c.mat)).map((c) => {
    const m = maitriseDe(c.id);
    const besoin = [3, 3.2, 2, 0.8][m];
    const der = derniereSeanceChap(c.id);
    const depuis = der ? daysBetween(der, auj) : 28;

    const alterne = derMat === c.mat ? 0.7 : 1;

  }).sort((a, b) => b.score - a.score).map((x) => x.c);

  const auj = todayKey();

  try { memo = JSON.parse(localStorage.getItem("carnet.chapSoir") || "null"); } catch (e) { memo = null; }
  const classes = classementChapitres();
  if (!classes.length) return null;
  if (memo && memo.date === auj && CHAP[memo.id] && epreuveActive(CHAP[memo.id].mat)) return CHAP[memo.id];
  const choisi = classes[0];

}
function changerChapitreDuSoir() {
  const actuel = chapitreDuSoir();
  const classes = classementChapitres();
  const i = classes.findIndex((c) => actuel && c.id === actuel.id);
  const suivant = classes[(i + 1) % classes.length];
  try { localStorage.setItem("carnet.chapSoir", JSON.stringify({ date: todayKey(), id: suivant.id })); } catch (e) { /* ignoré */ }

function typeExercicePour(mat) {
  return { ses: "ses-ec1", hggsp: "hggsp-dissert", philo: "philo-dissert", go: "go-jury" }[mat];
}
const POURQUOI = {
  cartes: "Se tester fait retenir bien plus que relire : c’est l’effet test.",
  quiz: "Le quiz montre ce que tu crois savoir… et ce que tu sais vraiment.",
  exercice: "Le bac note des copies : il faut s’entraîner à produire, pas seulement à apprendre.",
  explique: "Si tu sais l’expliquer simplement, tu l’as compris. Sinon, tu sais quoi revoir.",
  erreurs: "Relire ses erreurs, c’est ce qui évite de les refaire le jour J.",
  bilan: "Deux questions pour garder la trace de ta soirée."
};
function planDuSoir() {
  const obj = S.config.objectif;
  const fait = minutesDuJour(todayKey());
  const reste = Math.max(15, obj - fait);
  const ch = S.chapSoirSecours && CHAP[S.chapSoirSecours] ? CHAP[S.chapSoirSecours] : chapitreDuSoir();
  const etapes = [];
  const dues = cartesDues().length;
  let t = reste;
  if (dues > 0) { const m = clamp(Math.ceil(dues * 0.6), 4, 10); etapes.push({ type: "cartes", mode: "dues", minutes: m, titre: "Cartes à revoir", detail: pluriel(dues, "carte") + " prévue" + (dues > 1 ? "s" : "") + " aujourd’hui" }); t -= m; }
  const err = erreursNonRelues().length;
  const tErr = err ? 4 : 0;
  const tBilan = 2;
  const principal = Math.max(10, t - tErr - tBilan);
  if (ch) {
    const m = maitriseDe(ch.id);
    const nom = `${MATIERES[ch.mat].nom} · ${ch.court}`;
    if (ch.mat === "go") {
      etapes.push({ type: "exercice", chap: ch.id, exo: "go-jury", minutes: principal, titre: "Grand oral : questions du jury", detail: nom });
    } else if (m <= 1) {
      const a = Math.round(principal * 0.55);
      etapes.push({ type: "cartes", mode: "chap", chap: ch.id, minutes: a, titre: "Apprendre avec les cartes", detail: nom });
      etapes.push({ type: "quiz", chap: ch.id, minutes: principal - a, titre: "Vérifier avec un quiz", detail: nom });
    } else if (m === 2) {
      etapes.push({ type: "exercice", chap: ch.id, exo: typeExercicePour(ch.mat), minutes: principal, titre: "S’entraîner : exercice type bac", detail: nom });
    } else {
      const a = Math.round(principal * 0.35);
      etapes.push({ type: "explique", chap: ch.id, minutes: a, titre: "Explique-le avec tes mots", detail: nom });
      etapes.push({ type: "exercice", chap: ch.id, exo: ch.mat === "ses" ? "ses-dissert" : typeExercicePour(ch.mat), minutes: principal - a, titre: "Exercice type bac", detail: nom });
    }
  }
  if (tErr) etapes.push({ type: "erreurs", minutes: tErr, titre: "Relire tes erreurs", detail: pluriel(err, "erreur") + " à relire" });
  etapes.push({ type: "bilan", minutes: tBilan, titre: "Bilan de la soirée", detail: "Concentration et temps TikTok" });
  return { chap: ch, etapes, total: etapes.reduce((a, e) => a + e.minutes, 0) };
}

/* ---------- Échéances ---------- */
function prochaineEcheance() {
  const auj = todayKey();
  const toutes = DATES_CLES.map((d) => ({ ...d })).concat((S.config.echeances || []).map((e) => ({ date: e.date, titre: e.titre, type: "perso" })));
  return toutes.filter((d) => (d.fin || d.date) >= auj).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}

    let enPause = false;
    btnPause.addEventListener("click", () => {
      enPause = !enPause;
      if (enPause) { ctx.chrono.manuel = true; ctx.chrono.pauser(); vider(btnPause).append(icone("lecture"), "Reprendre"); }
      else { ctx.chrono.manuel = false; ctx.chrono.reprendre(); vider(btnPause).append(icone("pause"), "Pause"); }

      h("div", { class: "grand-anneau" }, sv("svg", { viewBox: "0 0 260 260", "aria-hidden": "true" }, sv("circle", { cx: 130, cy: 130, r: R, fill: "none", stroke: "var(--ligne-forte)", "stroke-width": 14 }), arc), val),

    inter = setInterval(() => {
      const ecoule = ctx.chrono.ms() - debut;
      const reste = duree * 60000 - ecoule;
      val.textContent = fmtChrono(reste);
      arc.setAttribute("stroke-dashoffset", String(C * clamp(ecoule / (duree * 60000), 0, 1)));
      if (reste <= 0) terminer(false);
    }, 500);
    const terminer = (avant) => {
      clearInterval(inter); inter = null;
      try { if (verrou) verrou.release(); } catch (e) { /* ignoré */ }
      const minutes = Math.round((ctx.chrono.ms() - debut) / 60000);
      vider(zone).append(h("div", { class: "tampon-zone" }, h("div", { class: "tampon bleu" }, avant ? `${minutes} min` : "Tenu !"), h("p", null, avant ? "Arrêté avant la fin, mais c’est du temps gagné." : `${duree} minutes de concentration. Bien joué.`)),

    };
    ctx.surNettoyage = () => { if (inter) clearInterval(inter); try { if (verrou) verrou.release(); } catch (e) { /* ignoré */ } };
  }
  reglage();
}

/* ---------- Enregistrer une séance ---------- */
function enregistrerSeance({ etapes, minutes, chrono, concentration, commentaire, origine }) {
  if (minutes < 1) return null;
  const id = uid();
  Store.ecrire("sessions", id, {
    date: dateKey(new Date(chrono.debut)), debut: chrono.debut, fin: Date.now(), minutes, objectif: S.config.objectif,

    sorties: chrono.sorties, decroches: chrono.decroches, concentration: concentration ?? null, commentaire: commentaire || "", origine
  });
  return id;

/* ---------- Activité seule (depuis Réviser ou un chapitre) ---------- */
function ouvrirActivite(type, params) {
  const chrono = new Chrono();
  let fini = false;
  const p = Object.assign({}, params || {});
  const ctxAct = { chrono, fini: null, libelleSuite: null, surNettoyage: null };
  ouvrirFeuille({
    titre: TITRES_ACT[type] + (p.chap ? " · " + CHAP[p.chap].court : ""),
    avantFermeture: async () => {
      if (fini) return true;
      const min = chrono.minutes();
      if (min >= 1) {
        const v = await dialogue({ titre: "Arrêter l’activité ?", texte: `Tu as travaillé ${fmtMin(min)}. Ce temps sera enregistré.`, boutons: [{ label: "Arrêter et enregistrer", valeur: "oui", cls: "primaire" }, { label: "Continuer", valeur: "non" }] });
        if (v !== "oui") return false;
        chrono.arreter(); fini = true;
        enregistrerSeance({ etapes: [{ type, chap: p.chap, mat: p.mat, resume: "Activité interrompue" }], minutes: min, chrono, origine: "activite" });
        if (ctxAct.surNettoyage) ctxAct.surNettoyage();
        return true;
      }
      chrono.arreter(); if (ctxAct.surNettoyage) ctxAct.surNettoyage();
      return true;
    },
    construire: (f) => {
      chrono.surRetour = (ms) => demanderRetour(chrono, ms);
      if (type !== "minuteur") chrono.demarrer(); else { chrono.demarrer(); chrono.pauser(); }
      ctxAct.chrono = chrono;
      ctxAct.fini = (res) => {
        fini = true; chrono.arreter();
        const min = Math.max(chrono.minutes(), res.minutes || 0);
        enregistrerSeance({ etapes: [{ ...res, chap: res.chap || p.chap }], minutes: min, chrono, origine: "activite" });
        afficherFin(f.corps, min, res.resume, () => f.fermer(true));
      };
      ACTIVITES[type](f.corps, p, ctxAct);
    }
  });
}

function lancerSoiree() {

  const plan = planDuSoir();
  const chrono = new Chrono();

  const resultats = [];
  let iEtape = -1, termine = false, inter = null, nettoyage = null;

  ouvrirFeuille({
    titre: "Séance du soir",
    avantFermeture: async () => {
      if (termine) return true;

      const min = chrono.minutes();
      const v = await dialogue({ titre: "Arrêter la séance ?", texte: min >= 1 ? `Tu as travaillé ${fmtMin(min)}. Ce temps sera enregistré.` : "Moins d’une minute : rien ne sera enregistré.",
        boutons: [{ label: "Arrêter", valeur: "oui", cls: "primaire" }, { label: "Continuer la séance", valeur: "non" }] });
      if (v !== "oui") return false;
      termine = true; chrono.arreter(); clearInterval(inter); if (nettoyage) nettoyage();

      const barre = h("div", { class: "chrono-barre" }, h("span", { class: "temps" }, "00:00"), h("div", { class: "barre" }, h("i", { style: "width:0%" })), h("span", { class: "petit tnum" }, "/ " + fmtMin(plan.total)));
      const etapesEl = h("div", { class: "etapes", style: "padding:8px 20px 0" });
      f.feuille.insertBefore(barre, f.corps);
      f.feuille.insertBefore(etapesEl, f.corps);
      const majEtapes = () => {
        vider(etapesEl).append(plan.etapes.map((e, k) => h("span", { class: k === iEtape ? "encours" : k < iEtape ? "fini" : "" }, `${k + 1}. ${TITRES_ACT[e.type]}`)));
      };
      const tick = () => {
        const ms = chrono.ms();
        barre.querySelector(".temps").textContent = fmtChrono(ms);
        barre.querySelector("i").style.width = `${clamp(ms / objectifMs * 100, 0, 100)}%`;
      };
      majEtapes();

        majConfig({ prenom: c.prenom.trim().slice(0, 40), objectif: c.objectif, moyennePrecedente: Number.isFinite(c.moyennePrecedente) ? clamp(c.moyennePrecedente, 0, 20) : null, lva: (c.lva || "LV A").trim().slice(0, 30), lvb: (c.lvb || "LV B").trim().slice(0, 30) });
        f.fermer(true); toast("Enregistré.");
      } }, "Enregistrer"));
  } });
}
function formGO() {
  ouvrirFeuille({ titre: "Mes questions de grand oral", construire: (f) => {
    const qs = [...(S.config.questionsGO || ["", ""])];
    f.corps.append(
      h("p", { class: "sous" }, "Une bonne question est précise, problématisée et liée au programme. Exemple : « La taxe carbone peut-elle être juste socialement ? » (SES)."),
      [0, 1].map((k) => h("label", { class: "champ" }, `Question ${k + 1}`, h("textarea", { id: `go-${k}`, style: "min-height:80px", value: qs[k] || "", oninput: (e) => { qs[k] = e.target.value; } }))),
      h("button", { class: "btn grand primaire", type: "button", onclick: () => { majConfig({ questionsGO: qs.map((q) => (q || "").trim().slice(0, 300)) }); f.fermer(true); toast("Questions enregistrées."); } }, "Enregistrer"));
  } });
}
function formEcheance() {
  ouvrirFeuille({ titre: "Ajouter une date", construire: (f) => {
    const e = { titre: "", date: addDays(todayKey(), 7) };
    f.corps.append(
      h("label", { class: "champ" }, "Quoi ?", h("input", { type: "text", id: "ech-t", placeholder: "ex. Bac blanc de SES", oninput: (ev) => { e.titre = ev.target.value; } })),
      h("label", { class: "champ" }, "Quand ?", h("input", { type: "date", id: "ech-d", value: e.date, oninput: (ev) => { e.date = ev.target.value; } })),
      h("button", { class: "btn grand primaire", type: "button", onclick: () => {
        if (!e.titre.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) { toast("Indique un titre et une date."); return; }
        majConfig({ echeances: (S.config.echeances || []).concat([{ titre: e.titre.trim().slice(0, 80), date: e.date }]) }); f.fermer(true);
      } }, "Ajouter"));
  } });
}
async function copierDonnees() {
  const data = { config: S.config };
  for (const c of COLLECTIONS) data[c] = [...S[c].values()];
  const txt = JSON.stringify(data, null, 1);
  try { await navigator.clipboard.writeText(txt); toast("Données copiées : colle-les dans un fichier pour les garder."); }
  catch (e) { toast("La copie a été refusée par le navigateur."); }
}

/* ---------- Démarrage ---------- */
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); planifierRendu(); });
let largeurPrec = window.innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(window.__rz);
  window.__rz = setTimeout(() => { if (Math.abs(window.innerWidth - largeurPrec) > 30) { largeurPrec = window.innerWidth; planifierRendu(); } }, 200);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && !Feuilles.length) planifierRendu(); });
rendre();
Store.init();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

})();
