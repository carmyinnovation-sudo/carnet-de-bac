/* Direction : une copie double — grands carreaux Seyès en fond, marge rouge, compte à rebours écrit au stylo bleu. */
:root {
  --papier: #f6f8fc;
  --feuille: #ffffff;
  --encre: #18233f;
  --encre-2: #4c5875;
  --encre-3: #66718c;
  --ligne: #e4eaf5;
  --ligne-forte: #cfd9ec;
  --marge: #ee95a4;
  --bic: #1f4fd8;
  --sur-bic: #ffffff;
  --bic-doux: #e9effd;
  --rouge: #c8243a;
  --rouge-doux: #fdecef;
  --vert: #1e7a4c;
  --vert-doux: #e6f4ec;
  --orange: #a65e00;
  --orange-doux: #fdf1dc;
  --ombre: 0 1px 0 rgba(24, 35, 63, .04), 0 10px 28px -18px rgba(24, 35, 63, .35);

  /* graphiques (palette validée) */
  --s-ses: #2a78d6; --s-hggsp: #eb6834; --s-philo: #1baf7a;
  --barre: #2a78d6; --barre-part: #86b6ef;
  --tk1: #ec9979; --tk2: #db754b; --tk3: #c5521c; --tk4: #a43700; --tk5: #7d2600;
  --st-bon: #0ca30c; --st-moyen: #fab219; --st-faible: #d03b3b; --st-aucun: #c3cad8;
  --grille: #e6eaf2; --axe: #c6cddb;

  --f-display: "Kalam", "Segoe Print", "Bradley Hand", cursive;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-xs: .8125rem; --t-s: .875rem; --t-m: 1rem; --t-l: 1.1875rem; --t-xl: 1.5rem; --t-xxl: 2.125rem;
  --r: 14px; --r-s: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #0c1220; --feuille: #141d31; --encre: #e6ecf8; --encre-2: #b5bfd5; --encre-3: #929db6;

    --ombre: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
    --s-ses: #3987e5; --s-hggsp: #d95926; --s-philo: #199e70;
    --barre: #5598e7; --barre-part: #1f5cab;
    --tk1: #824121; --tk2: #ae5528; --tk3: #d86d38; --tk4: #f19266; --tk5: #ffbc9d;

    color-scheme: dark;
  }
}

  --papier: #0c1220; --feuille: #141d31; --encre: #e6ecf8; --encre-2: #b5bfd5; --encre-3: #929db6;
  --ligne: #172036; --ligne-forte: #26324d; --marge: #6e2f3d;
  --bic: #7fa2ff; --sur-bic: #0c1220; --bic-doux: #1b2848;
  --rouge: #ff7a88; --rouge-doux: #3a1a24; --vert: #4cc38a; --vert-doux: #14301f; --orange: #f0a040; --orange-doux: #35270f;
  --ombre: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
  --s-ses: #3987e5; --s-hggsp: #d95926; --s-philo: #199e70;
  --barre: #5598e7; --barre-part: #1f5cab;
  --tk1: #824121; --tk2: #ae5528; --tk3: #d86d38; --tk4: #f19266; --tk5: #ffbc9d;
  --st-aucun: #3a4560; --grille: #1f2940; --axe: #334061;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--f-body);
  font-size: var(--t-m);
  line-height: 1.45;
  color: var(--encre);
  background-color: var(--papier);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne-forte) 31px 32px),
    repeating-linear-gradient(to bottom, transparent 0 7px, var(--ligne) 7px 8px),
    repeating-linear-gradient(to right, transparent 0 31px, var(--ligne) 31px 32px);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}
.marge-rouge { position: fixed; top: 0; bottom: 0; left: 9px; width: 2px; background: var(--marge); opacity: .75; pointer-events: none; z-index: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--bic); }
:focus-visible { outline: 3px solid var(--bic); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Coquille ---------- */
.app { position: relative; z-index: 1; min-height: 100%; }
.main { padding: 18px 16px 104px 22px; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--feuille) 94%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--ligne-forte);
  padding: 6px 6px 8px;
}
.nav a {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-decoration: none; color: var(--encre-2); font-size: var(--t-xs); padding: 6px 2px; border-radius: 10px;
}
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--bic); font-weight: 700; background: var(--bic-doux); }
.nav .marque { display: none; }

@media (min-width: 960px) {
  .marge-rouge { left: 236px; }
  .nav {
    top: 0; bottom: 0; right: auto; width: 228px; display: flex; flex-direction: column; gap: 4px;
    border-top: 0; border-right: 1px solid var(--ligne-forte); padding: 22px 14px;
    background: var(--feuille);
  }
  .nav .marque { display: block; font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; color: var(--bic); padding: 0 10px 18px; line-height: 1.1; }
  .nav .marque small { display: block; font-family: var(--f-body); font-weight: 400; font-size: var(--t-xs); color: var(--encre-2); margin-top: 4px; }
  .nav a { flex-direction: row; gap: 12px; font-size: var(--t-m); padding: 10px 12px; }
  .main { margin-left: 260px; margin-right: auto; max-width: 1120px; padding: 32px 32px 48px; width: calc(100% - 260px); }
}

/* ---------- Éléments ---------- */
.carte {
  background: var(--feuille); border: 1px solid var(--ligne-forte); border-radius: var(--r);
  box-shadow: var(--ombre); padding: 16px;
}
.carte > * + * { margin-top: 12px; }
.carte-titre { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.carte-titre h2, .h2 { font-size: var(--t-l); font-weight: 700; }
.sous { color: var(--encre-2); font-size: var(--t-s); }
.petit { font-size: var(--t-xs); color: var(--encre-2); }
.page-titre { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.page-titre h1 { font-size: var(--t-xxl); font-family: var(--f-display); font-weight: 700; color: var(--encre); line-height: 1.05; }
.page-titre p { color: var(--encre-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); color: var(--encre); font-weight: 700; cursor: pointer; text-align: center;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:hover { background: var(--bic-doux); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primaire { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }
.btn.primaire:hover { filter: brightness(1.06); }
.btn.grand { min-height: 56px; font-size: var(--t-l); border-radius: 14px; width: 100%; }
.btn.fantome { background: transparent; border-color: transparent; color: var(--bic); }
.btn.fantome:hover { background: var(--bic-doux); }
.btn.danger { color: var(--rouge); }
.btn.ok { background: var(--vert); border-color: var(--vert); color: #fff; }
:root[data-theme="dark"] .btn.ok { color: #0c1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok { color: #0c1220; } }
.btn.non { color: var(--rouge); border-color: color-mix(in srgb, var(--rouge) 45%, var(--ligne-forte)); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.petit-btn { min-height: 36px; padding: 6px 12px; font-size: var(--t-s); }
.rangee { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rangee.etire > * { flex: 1 1 0; }
.pile { display: flex; flex-direction: column; gap: 10px; }

.puce {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: var(--t-xs); font-weight: 700; border: 1px solid var(--ligne-forte); background: var(--feuille); color: var(--encre-2);
  white-space: nowrap;
}
.puce.bic { background: var(--bic-doux); color: var(--bic); border-color: transparent; }
.puce.bac { background: var(--bic); color: var(--sur-bic); border-color: transparent; }
.puce.hors { background: transparent; color: var(--encre-3); border-style: dashed; }
.puce .pt { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.puces { display: flex; gap: 8px; flex-wrap: wrap; }

.choix { display: flex; flex-wrap: wrap; gap: 8px; }
.choix button {
  min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); cursor: pointer; font-size: var(--t-s); font-weight: 700; color: var(--encre-2);
}
.choix button[aria-pressed="true"] { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }

.bandeau { border-radius: var(--r-s); padding: 10px 14px; font-size: var(--t-s); display: flex; gap: 10px; align-items: flex-start; }
.bandeau svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.bandeau.info { background: var(--bic-doux); color: var(--encre); }
.bandeau.alerte { background: var(--orange-doux); color: var(--encre); }
.bandeau.erreur { background: var(--rouge-doux); color: var(--encre); }

label.champ { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: var(--t-s); }
label.champ .aide { font-weight: 400; color: var(--encre-2); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); color: var(--encre);
}
textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
textarea.copie {
  min-height: 260px; padding: 12px 14px 12px 22px; line-height: 32px;
  background-image: linear-gradient(to right, transparent 12px, var(--marge) 12px 14px, transparent 14px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne-forte) 31px 32px);
  background-attachment: local;
}
.case { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.case input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--bic); }

/* ---------- Ce soir ---------- */
.entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.date-du-jour { font-size: var(--t-s); color: var(--encre-2); }
.date-du-jour::first-letter, .journal .jd::first-letter { text-transform: uppercase; }
.salut { font-size: var(--t-xl); font-weight: 700; }
.etat-sync { font-size: var(--t-xs); color: var(--encre-3); display: inline-flex; align-items: center; gap: 6px; }
.etat-sync .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--st-aucun); }
.etat-sync.ok .pt { background: var(--st-bon); }
.etat-sync.lent .pt { background: var(--st-moyen); }

.hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 4px 0 0; }
.compte {
  font-family: var(--f-display); font-weight: 700; color: var(--bic);
  font-size: clamp(3.6rem, 17vw, 5.6rem); line-height: .95; letter-spacing: -.01em;
  transform: rotate(-2deg); transform-origin: left bottom; display: inline-block;
}
.compte-sous { color: var(--encre-2); font-size: var(--t-s); margin-top: 6px; }
.compte-sous strong { color: var(--encre); }
.trait { display: block; height: 10px; width: min(220px, 70%); margin-top: 2px; }
.anneau { position: relative; width: 128px; height: 128px; }
.anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anneau .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.anneau .val b { font-size: 1.75rem; line-height: 1; }
.anneau .val span { font-size: var(--t-xs); color: var(--encre-2); }

.semaine { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.semaine .j { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--t-xs); color: var(--encre-2); }
.semaine .rond { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ligne-forte); background: var(--feuille); }
.semaine .rond.part { background: linear-gradient(to top, var(--barre-part) 50%, var(--feuille) 50%); border-color: var(--barre-part); }
.semaine .rond.plein { background: var(--barre); border-color: var(--barre); }
.semaine .j.auj .rond { outline: 2px solid var(--bic); outline-offset: 2px; }
.serie { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--t-s); color: var(--encre-2); }
.serie b { color: var(--encre); font-size: var(--t-l); }

.mot { border-left: 4px solid var(--marge); background: var(--feuille); }
.mot .mot-txt { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.35; color: var(--encre); white-space: pre-wrap; }

.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--ligne-forte); }
.plan li:first-child { border-top: 0; }
.plan .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--bic-doux); color: var(--bic); display: grid; place-items: center; }
.plan .ico svg { width: 20px; height: 20px; }
.plan .lbl b { display: block; }
.plan .lbl span { font-size: var(--t-s); color: var(--encre-2); }
.plan .min { font-weight: 700; color: var(--encre-2); font-size: var(--t-s); }
.plan li.fait .lbl b { text-decoration: line-through; text-decoration-color: var(--rouge); }

.raccourcis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.raccourci { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px; min-height: 76px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; }
.raccourci:hover { background: var(--bic-doux); }
.raccourci svg { width: 22px; height: 22px; color: var(--bic); }
.raccourci b { font-size: var(--t-s); }
.raccourci span { font-size: var(--t-xs); color: var(--encre-2); }

/* ---------- Réviser ---------- */
.methodes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 700px) { .methodes { grid-template-columns: repeat(3, 1fr); } }
.methode { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--ligne-forte); background: var(--feuille); box-shadow: var(--ombre); cursor: pointer; min-height: 128px; }
.methode:hover { border-color: var(--bic); }
.methode .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bic-doux); color: var(--bic); }
.methode .ico svg { width: 22px; height: 22px; }
.methode b { font-size: var(--t-m); }
.methode span { font-size: var(--t-xs); color: var(--encre-2); }
.methode .meta { margin-top: auto; font-weight: 700; color: var(--bic); font-size: var(--t-xs); }

.liste-chap { display: flex; flex-direction: column; }
.liste-chap .groupe { font-size: var(--t-xs); font-weight: 700; color: var(--encre-3); text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 6px; }
.chap { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--ligne); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.chap:hover { background: var(--bic-doux); }
.chap .t { font-weight: 700; font-size: var(--t-s); }
.chap .s { font-size: var(--t-xs); color: var(--encre-2); }
.maitrise { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 700; color: var(--encre-2); white-space: nowrap; }
.maitrise .pt { width: 12px; height: 12px; border-radius: 4px; background: var(--st-aucun); flex: none; }
.maitrise.m1 .pt { background: var(--st-faible); }
.maitrise.m2 .pt { background: var(--st-moyen); }
.maitrise.m3 .pt { background: var(--st-bon); }
.jauge { height: 6px; border-radius: 3px; background: var(--ligne); overflow: hidden; width: 64px; }
.jauge i { display: block; height: 100%; background: var(--barre); border-radius: 3px; }

.segment { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.segment button { min-height: 52px; border-radius: 10px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; font-size: var(--t-xs); font-weight: 700; color: var(--encre-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px; }
.segment button .pt { width: 12px; height: 12px; border-radius: 4px; background: var(--st-aucun); }
.segment button[data-m="1"] .pt { background: var(--st-faible); }
.segment button[data-m="2"] .pt { background: var(--st-moyen); }
.segment button[data-m="3"] .pt { background: var(--st-bon); }
.segment button[aria-pressed="true"] { border-color: var(--bic); box-shadow: inset 0 0 0 2px var(--bic); color: var(--encre); }

/* ---------- Feuille (overlay) ---------- */
.voile { position: fixed; inset: 0; background: rgba(12, 18, 32, .45); z-index: 40; display: flex; align-items: stretch; justify-content: center; }
.feuille {
  position: relative; background: var(--papier); width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne) 31px 32px);
}
@media (min-width: 760px) {
  .voile { align-items: center; padding: 24px; }
  .feuille { max-width: 760px; height: auto; max-height: calc(100% - 48px); border-radius: 18px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.5); }
}
.feuille-tete { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--ligne-forte); background: var(--feuille); }
.feuille-tete h2 { font-size: var(--t-l); flex: 1; }
.feuille-tete .fermer { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; display: grid; place-items: center; }
.feuille-tete .fermer svg { width: 20px; height: 20px; }
.feuille-corps { overflow-y: auto; padding: 18px 16px 32px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.feuille-pied { padding: 12px 16px; border-top: 1px solid var(--ligne-forte); background: var(--feuille); display: flex; gap: 10px; flex-wrap: wrap; }
.feuille-pied > .btn { flex: 1 1 140px; }
.chrono-barre { display: flex; align-items: center; gap: 12px; padding: 8px 20px; background: var(--feuille); border-bottom: 1px solid var(--ligne); font-size: var(--t-s); }
.chrono-barre .temps { font-weight: 700; font-variant-numeric: tabular-nums; }
.chrono-barre .barre { flex: 1; height: 8px; border-radius: 4px; background: var(--ligne); overflow: hidden; }
.chrono-barre .barre i { display: block; height: 100%; background: var(--bic); border-radius: 4px; transition: width .5s linear; }
.etapes { display: flex; gap: 6px; flex-wrap: wrap; }
.etapes span { font-size: var(--t-xs); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--ligne-forte); color: var(--encre-2); background: var(--feuille); }
.etapes span.encours { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }
.etapes span.fini { text-decoration: line-through; }
.pause-zone { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 0 8px; }
.pause-temps { font-family: var(--f-display); font-size: 4.5rem; font-weight: 700; line-height: 1; color: var(--bic); }
.pause-temps.depasse { color: var(--rouge); }
.pause-msg { max-width: 34ch; font-size: var(--t-l); }
.fin-bloc { position: sticky; top: 0; z-index: 2; }
.plan li.pause { padding: 4px 0; border-top: 0; }
.plan li.pause .ico { background: transparent; color: var(--encre-3); }
.plan li.pause .lbl, .plan li.pause .min { font-size: var(--t-xs); color: var(--encre-3); font-weight: 400; }

/* cartes mémoire */
.flash { min-height: 230px; display: flex; flex-direction: column; gap: 14px; justify-content: center; padding: 22px 18px; border-radius: 16px; background: var(--feuille); border: 1px solid var(--ligne-forte); box-shadow: var(--ombre); }
.flash .q { font-size: 1.45rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.flash .r { font-size: var(--t-m); line-height: 1.55; border-top: 1px dashed var(--ligne-forte); padding-top: 14px; }
.compteur { display: flex; justify-content: space-between; font-size: var(--t-s); color: var(--encre-2); }

.sujet { background: var(--feuille); border: 1px solid var(--ligne-forte); border-left: 4px solid var(--marge); border-radius: 12px; padding: 14px 16px; }
.sujet .t { font-size: var(--t-l); font-weight: 700; line-height: 1.3; }
details.repli { border: 1px solid var(--ligne-forte); border-radius: 12px; background: var(--feuille); padding: 0 14px; }
details.repli summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
details.repli[open] { padding-bottom: 12px; }
details.repli ol, details.repli ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.retour { display: flex; flex-direction: column; gap: 12px; }
.retour .note { font-family: var(--f-display); font-weight: 700; color: var(--rouge); font-size: 2.6rem; line-height: 1; transform: rotate(-4deg); display: inline-block; }
.retour h3 { font-size: var(--t-m); }
.retour ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.qcm { display: flex; flex-direction: column; gap: 8px; }
.qcm button { text-align: left; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; line-height: 1.4; }
.qcm button.bon { border-color: var(--vert); background: var(--vert-doux); }
.qcm button.mauvais { border-color: var(--rouge); background: var(--rouge-doux); }
.qcm.dates { display: grid; grid-template-columns: 1fr 1fr; }
.qcm.dates button { text-align: center; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.flash.quiz-q { min-height: 150px; }
.flash.quiz-q .q { font-size: 1.2rem; }
input.saisie-quiz { font-size: 1.35rem; font-weight: 700; text-align: center; min-height: 56px; }
input.saisie-quiz.bon { border-color: var(--vert); background: var(--vert-doux); }
input.saisie-quiz.mauvais { border-color: var(--rouge); background: var(--rouge-doux); }
.retour-q { line-height: 1.5; }

.minuteur { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 0; }
.minuteur .grand-anneau { width: min(260px, 70vw); aspect-ratio: 1; position: relative; }

.minuteur .grand-anneau .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }

/* tampon de fin */
.tampon-zone { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0 8px; text-align: center; }
.tampon {
  font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--rouge);
  border: 4px solid var(--rouge); border-radius: 12px; padding: 8px 18px; font-size: 1.9rem; transform: rotate(-9deg);
  animation: tamponner .45s cubic-bezier(.2, 1.4, .4, 1) both;
}
.tampon.bleu { color: var(--bic); border-color: var(--bic); }
@keyframes tamponner { from { transform: rotate(-9deg) scale(1.8); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tampon { animation: none; } .btn { transition: none; } .chrono-barre .barre i { transition: none; } }

/* dialogue interne */
.dialogue-voile { position: fixed; inset: 0; z-index: 60; background: rgba(12,18,32,.55); display: grid; place-items: center; padding: 20px; }
.dialogue { background: var(--feuille); border-radius: 16px; padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
.dialogue h3 { font-size: var(--t-l); }

.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 80; background: var(--encre); color: var(--papier); padding: 10px 16px; border-radius: 12px; font-size: var(--t-s); max-width: calc(100% - 32px); box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
@media (min-width: 960px) { .toast { bottom: 28px; left: calc(50% + 114px); } }

.tuiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 960px) { .tuiles { grid-template-columns: repeat(4, 1fr); } }
.tuile { background: var(--feuille); border: 1px solid var(--ligne-forte); border-radius: var(--r); padding: 14px; box-shadow: var(--ombre); display: flex; flex-direction: column; gap: 4px; }

.legende .kl { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }

table.tab { width: 100%; border-collapse: collapse; font-size: var(--t-s); }

    { t: "d", q: "En quelle année a lieu la guerre des Six Jours ?", r: 1967, p: [1965, 1966, 1968, 1973], e: "Juin 1967. Pièges : 1956, c’est la crise de Suez ; 1973, la guerre du Kippour." },
    { t: "c", q: "Que demande la résolution 242 de l’ONU, après la guerre des Six Jours ?", r: "Le retrait de territoires occupés en échange de la paix", p: ["Le partage de la Palestine entre deux États", "Le retour de tous les réfugiés palestiniens", "Un statut international pour toute la Palestine"], e: "242 : « la terre contre la paix ». Le partage, c’est la résolution 181 ; le retour des réfugiés, la résolution 194." },
    { t: "c", q: "Quels territoires Israël occupe-t-il après la guerre des Six Jours ?", r: "Cisjordanie, Jérusalem-Est, Gaza, Sinaï et Golan", p: ["Cisjordanie, Jérusalem-Est, Gaza, Sinaï et Sud-Liban", "Cisjordanie, Jérusalem-Est, Gaza, Golan et Sud-Liban", "Jérusalem-Est, Gaza, Sinaï, Golan et Sud-Liban"], e: "Le Sinaï est rendu à l’Égypte après la paix de 1979. Piège : le Sud-Liban est occupé de 1982 à 2000, pas en 1967." },

    { t: "c", q: "Quelle différence entre la guerre du Golfe et la guerre d’Irak ?", r: "1991 avec mandat de l’ONU, 2003 sans mandat", p: ["1991 sans mandat de l’ONU, 2003 avec mandat", "Un mandat de l’ONU dans les deux cas", "La France participe en 2003, pas en 1991"], e: "1991 : coalition autorisée par l’ONU, France comprise. 2003 : intervention américano-britannique sans mandat, à laquelle la France s’oppose." },

    { t: "d", q: "En quelle année Louis-Philippe inaugure-t-il à Versailles le musée de l’Histoire de France ?", r: 1837, p: [1832, 1833, 1839, 1848], e: "1837 : un musée dédié « à toutes les gloires de la France », pour réconcilier les Français. Pièges : 1830, la révolution qui le porte au pouvoir ; 1848, sa chute." },

    { t: "c", q: "Où sont exposées la plupart des frises du Parthénon détachées par Elgin ?", r: "Au British Museum, à Londres", p: ["Au musée de l’Acropole, à Athènes", "Au musée du Louvre, à Paris", "Au Metropolitan Museum, à New York"], e: "Au British Museum. La Grèce réclame leur retour depuis les années 1980 et leur réserve une salle au musée de l’Acropole." },

    { t: "d", q: "En quelle année l’UNESCO adopte-t-elle la convention du patrimoine mondial ?", r: 1972, p: [1968, 1970, 1975, 1978], e: "1972. Pièges : 1970, convention contre le trafic de biens culturels ; 1978, premiers sites inscrits." },

    { t: "c", q: "Un État qui restaure ses monuments et les fait inscrire à l’UNESCO pour améliorer son image utilise…", r: "Le soft power", p: ["Le hard power", "Le sharp power", "Le smart power"], e: "Soft power : influencer par l’attraction (Joseph Nye). Hard power : par la contrainte (armée, sanctions). Smart power : mélange des deux. Sharp power : manipulation par des régimes autoritaires." }

    { t: "c", q: "La muséification, c’est…", r: "Figer un quartier en musée à ciel ouvert", p: ["Transformer une usine fermée en musée", "Faire entrer un objet dans le patrimoine", "Exposer des œuvres venues d’un autre pays"], e: "La muséification se fait au détriment des habitants. Une usine devenue musée, c’est une reconversion ; faire entrer un objet dans le patrimoine, une patrimonialisation." },

    { t: "c", q: "À quelle période situe-t-on le petit âge glaciaire en Europe ?", r: "Du XIVe au XIXe siècle environ", p: ["Du Xe au XIIIe siècle environ", "Du XIIe au XVe siècle environ", "Du XVIIe au XXe siècle environ"], e: "XIVe-XIXe siècle. Piège : Xe-XIIIe siècle, c’est l’optimum climatique médiéval, plus doux." },
    { t: "c", q: "À quelle période situe-t-on l’optimum climatique médiéval ?", r: "Du Xe au XIIIe siècle environ", p: ["Du XIVe au XIXe siècle environ", "Du Ve au VIIIe siècle environ", "Du XIIe au XVe siècle environ"], e: "Xe-XIIIe siècle : une période plus douce en Europe, avant le petit âge glaciaire." },
    { t: "d", q: "En quelle année le « grand hiver » frappe-t-il la France ?", r: 1709, p: [1694, 1704, 1707, 1710, 1712], e: "1709, à la fin du règne de Louis XIV. Piège : 1693-1694, c’est la grande famine, qui tue plus d’un million de personnes." },
    { t: "d", q: "En quelle année est créé le GIEC ?", r: 1988, p: [1979, 1985, 1990, 1992], e: "1988. Pièges : 1990, son premier rapport ; 1992, le sommet de Rio." },
    { t: "n", q: "Quel groupe d’experts publie les rapports de référence sur le climat ?", r: "GIEC", ok: ["IPCC"], p: ["PNUE", "OMM", "UICN"], e: "Le GIEC (IPCC en anglais), créé par l’OMM (Organisation météorologique mondiale) et le PNUE (Programme des Nations unies pour l’environnement). L’UICN publie la liste rouge des espèces menacées." },
    { t: "d", q: "En quelle année a lieu le sommet de la Terre de Rio ?", r: 1992, p: [1972, 1990, 1994, 1997], e: "Juin 1992. Pièges : 1972, le premier sommet de la Terre, à Stockholm ; 1997, le protocole de Kyoto." },
    { t: "c", q: "Que crée le sommet de la Terre de Rio ?", r: "La convention-cadre de l’ONU sur le climat", p: ["Le GIEC", "Le protocole de Kyoto", "Le Programme des Nations unies pour l’environnement"], e: "La CCNUCC, dont les États se réunissent ensuite chaque année aux COP. Le GIEC date de 1988, Kyoto de 1997, le PNUE de 1972." },
    { t: "d", q: "En quelle année est adopté le protocole de Kyoto ?", r: 1997, p: [1992, 1995, 1999, 2005], e: "Décembre 1997. Piège : 2005, c’est son entrée en vigueur, après la ratification russe." },
    { t: "c", q: "Quelle est la grande différence entre Kyoto et l’accord de Paris ?", r: "Kyoto contraint les pays riches ; Paris repose sur des engagements de tous", p: ["Kyoto repose sur le volontariat ; Paris contraint tous les pays", "Kyoto concerne tous les pays ; Paris seulement les riches", "Kyoto a été ratifié par les États-Unis, Paris non"], e: "Kyoto : objectifs contraignants pour les seuls pays industrialisés. Paris : chaque pays fixe ses propres engagements (contributions nationales volontaires)." },
    { t: "c", q: "Quel objectif fixe l’accord de Paris ?", r: "Nettement moins de 2 °C, en visant 1,5 °C", p: ["Moins de 3 °C, en visant 2 °C", "Moins de 1,5 °C, en visant 1 °C", "Diviser par deux les émissions d’ici 2020"], e: "Par rapport à l’ère préindustrielle, avec des contributions nationales volontaires." },
    { t: "d", q: "En quelle année se tient la COP21, qui adopte l’accord de Paris ?", r: 2015, p: [2009, 2013, 2014, 2016], e: "Décembre 2015. Pièges : 2009, l’échec de la COP15 de Copenhague ; 2016, l’entrée en vigueur de l’accord." },
    { t: "d", q: "En quelle année Donald Trump annonce-t-il pour la première fois le retrait de l’accord de Paris ?", r: 2017, p: [2016, 2018, 2019, 2020], e: "Juin 2017, effectif en novembre 2020. Biden y revient en 2021 ; Trump annonce un nouveau retrait en janvier 2025." },
    { t: "c", q: "Où se tient la COP30, en 2025 ?", r: "À Belém, au Brésil", p: ["À Bakou, en Azerbaïdjan", "À Dubaï, aux Émirats arabes unis", "À Charm el-Cheikh, en Égypte"], e: "COP27 : Charm el-Cheikh (2022). COP28 : Dubaï (2023). COP29 : Bakou (2024). COP30 : Belém, en Amazonie (2025)." }
  ],
  "hg-t5c": [
    { t: "n", q: "Quel naturaliste fonde le Sierra Club en 1892 pour préserver la nature sauvage ?", r: "Muir", ok: ["John Muir"], p: ["Pinchot", "Thoreau", "Leopold"], e: "John Muir, défenseur de la préservation. Pinchot défend au contraire la conservation. Thoreau (Walden, 1854) et Aldo Leopold sont d’autres penseurs américains de la nature." },
    { t: "n", q: "Qui dirige à partir de 1905 le Service des forêts et défend une exploitation raisonnée des ressources ?", r: "Pinchot", ok: ["Gifford Pinchot"], p: ["Muir", "Leopold", "Thoreau"], e: "Gifford Pinchot, proche du président Theodore Roosevelt : c’est la conservation." },
    { t: "c", q: "La conservation, au sens de Pinchot, c’est…", r: "Exploiter la nature de façon raisonnée pour qu’elle dure", p: ["Protéger la nature pour elle-même, sans l’exploiter", "Interdire toute présence humaine dans les forêts", "Remettre un milieu dans son état d’origine"], e: "Conservation = usage raisonné (Pinchot). Préservation = la nature pour elle-même (Muir). Remettre en état, c’est la restauration." },
    { t: "c", q: "La préservation, au sens de John Muir, c’est…", r: "Protéger la nature sauvage pour elle-même", p: ["Exploiter les ressources de façon raisonnée", "Replanter les forêts après les coupes", "Protéger la nature pour le tourisme"], e: "Muir veut sanctuariser la wilderness ; Pinchot, gérer les ressources pour qu’elles durent (conservation)." },
    { t: "c", q: "Quand le Dust Bowl frappe-t-il les Grandes Plaines ?", r: "Dans les années 1930", p: ["Dans les années 1900", "Dans les années 1920", "Dans les années 1940"], e: "Années 1930, en pleine Grande Dépression : sécheresse et labours intensifs provoquent des tempêtes de poussière ; des centaines de milliers de fermiers partent vers la Californie." },
    { t: "d", q: "En quelle année est créée l’EPA, l’agence américaine de protection de l’environnement ?", r: 1970, p: [1968, 1969, 1972, 1973], e: "1970, l’année du premier « Jour de la Terre »." },
    { t: "n", q: "Sous quel président est créée l’EPA, l’agence fédérale de protection de l’environnement ?", r: "Nixon", ok: ["Richard Nixon"], p: ["Kennedy", "Johnson", "Carter", "Ford"], e: "Richard Nixon, un républicain : l’environnement fait alors consensus aux États-Unis." },
    { t: "d", q: "En quelle année est adopté le Clean Water Act ?", r: 1972, p: [1969, 1970, 1971, 1974], e: "1972. Piège : 1970, c’est le Clean Air Act renforcé et la création de l’EPA." },
    { t: "c", q: "Quel exemple montre les tensions entre l’État fédéral et les États fédérés ?", r: "La Californie impose des normes d’émission plus strictes", p: ["La Californie refuse d’appliquer le Clean Air Act", "Le Texas a signé seul l’accord de Paris", "L’Alaska interdit les parcs nationaux"], e: "La Californie impose aux voitures des normes plus strictes que l’État fédéral, qui tente parfois de l’en empêcher." },
    { t: "c", q: "Quelle est la position des États-Unis sur le protocole de Kyoto ?", r: "Signé, mais jamais ratifié", p: ["Ratifié, puis quitté", "Jamais signé", "Ratifié et respecté"], e: "Signé sous Clinton, jamais ratifié par le Sénat ; George W. Bush le rejette en 2001. Piège : c’est le Canada qui l’a ratifié puis quitté (2011)." },
    { t: "c", q: "Quel pays est le premier émetteur mondial de CO2 ?", r: "La Chine", p: ["Les États-Unis", "L’Inde", "La Russie"], e: "La Chine, devant les États-Unis et l’Inde. Mais par habitant, un Américain émet nettement plus qu’un Chinois." },
    { t: "c", q: "Malgré les retraits de l’accord de Paris, qui continue à agir pour le climat aux États-Unis ?", r: "Des États fédérés, des villes et des entreprises", p: ["Le Sénat, qui a ratifié l’accord sans le président", "La Cour suprême, qui a annulé les retraits", "L’EPA, qui a quitté le gouvernement fédéral"], e: "Des États comme la Californie, des villes et des entreprises maintiennent leurs objectifs : un exemple de tension entre échelles." }
  ],

  /* ---------------- HGGSP · Thème 6 ---------------- */
  "hg-t6a": [
    { t: "c", q: "Une société de la connaissance, c’est une société où…", r: "Le savoir est au cœur de l’économie et de la puissance", p: ["Tout le monde a fait des études supérieures longues", "L’État contrôle étroitement la circulation des savoirs", "L’économie repose surtout sur l’industrie et les usines"], e: "Produire, diffuser et utiliser les connaissances devient une ressource économique et un enjeu de puissance." },
    { t: "c", q: "Pourquoi la Réforme protestante fait-elle progresser l’alphabétisation, y compris des femmes ?", r: "Chaque fidèle doit pouvoir lire la Bible lui-même", p: ["Luther invente l’imprimerie pour diffuser la Bible", "L’Église catholique ouvre des écoles pour tous", "Le latin devient obligatoire dans les écoles"], e: "Lire la Bible soi-même, dans sa langue. Piège : l’imprimerie, c’est Gutenberg, vers 1450, avant Luther." },
    { t: "c", q: "Quand sont votées les lois qui rendent l’école primaire gratuite, laïque et obligatoire ?", r: "En 1881-1882", p: ["En 1850-1851", "En 1867-1868", "En 1905-1906"], e: "1881 (gratuité), 1882 (obligation, laïcité), pour les filles comme pour les garçons. Pièges : 1850, loi Falloux ; 1867, loi Duruy (écoles de filles) ; 1905, séparation des Églises et de l’État." },
    { t: "n", q: "Quel ministre fait voter l’école gratuite, laïque et obligatoire ?", r: "Ferry", ok: ["Jules Ferry"], p: ["Guizot", "Duruy", "Falloux"], e: "Jules Ferry. Guizot impose une école de garçons par commune (1833) ; Falloux et Duruy font progresser les écoles de filles (1850, 1867)." },
    { t: "d", q: "En quelle année Henri Becquerel découvre-t-il la radioactivité ?", r: 1896, p: [1895, 1897, 1898, 1903], e: "1896, avec des sels d’uranium. Pièges : 1895, Röntgen découvre les rayons X ; 1898, les Curie découvrent le polonium et le radium." },
    { t: "n", q: "Qui découvre la radioactivité, à partir de sels d’uranium ?", r: "Becquerel", ok: ["Henri Becquerel"], p: ["Röntgen", "Rutherford", "Pierre Curie"], e: "Henri Becquerel. C’est Marie Curie qui invente le mot « radioactivité »." },
    { t: "d", q: "En quelle année Pierre et Marie Curie découvrent-ils le polonium et le radium ?", r: 1898, p: [1895, 1896, 1900, 1903], e: "1898. Piège : 1903, c’est leur premier prix Nobel." },
    { t: "c", q: "Quel prix Nobel Marie Curie reçoit-elle en 1903 ?", r: "Physique, avec Pierre Curie et Becquerel", p: ["Chimie, seule", "Physique, seule", "Physique, avec Pierre Curie seulement", "Chimie, avec Pierre Curie et Becquerel"], e: "1903 : physique, partagé. Plus tard : chimie, seule. Elle est la seule personne récompensée dans deux sciences différentes." },
    { t: "d", q: "En quelle année Marie Curie reçoit-elle, seule, le prix Nobel de chimie ?", r: 1911, p: [1903, 1906, 1909, 1913], e: "1911. Pièges : 1903, son premier Nobel ; 1906, la mort de Pierre Curie." },
    { t: "d", q: "En quelle année Irène et Frédéric Joliot-Curie découvrent-ils la radioactivité artificielle ?", r: 1934, p: [1932, 1935, 1936, 1938], e: "1934. Pièges : 1935, leur prix Nobel de chimie ; 1938, la découverte de la fission de l’uranium." },
    { t: "d", q: "En quelle année se tient le premier conseil Solvay, qui réunit les grands physiciens ?", r: 1911, p: [1907, 1908, 1913, 1927], e: "1911, à Bruxelles. Piège : 1927, le plus célèbre, avec Einstein, Bohr et Marie Curie, seule femme." },
    { t: "c", q: "Qu’est-ce que le projet Manhattan (1942-1945) ?", r: "Le programme secret américain de bombe atomique", p: ["Le programme secret soviétique de bombe atomique", "Le premier programme américain de conquête spatiale", "Un programme franco-britannique d’énergie nucléaire"], e: "Il mobilise des milliers de scientifiques, dont des exilés européens : la science devient un enjeu stratégique." }
  ],
  "hg-t6b": [
    { t: "d", q: "En quelle année est créée la CIA ?", r: 1947, p: [1945, 1946, 1949, 1954], e: "1947, au début de la guerre froide." },
    { t: "d", q: "En quelle année est créé le KGB ?", r: 1954, p: [1947, 1949, 1953, 1956], e: "1954, un an après la mort de Staline. Piège : 1947, c’est la CIA." },
    { t: "n", q: "Quel service américain est chargé du renseignement extérieur pendant la guerre froide ?", r: "CIA", p: ["FBI", "NSA", "KGB"], e: "La CIA. Le FBI est la police fédérale ; la NSA intercepte les communications ; le KGB est soviétique." },
    { t: "d", q: "En quelle année les époux Rosenberg sont-ils exécutés pour espionnage atomique ?", r: 1953, p: [1949, 1950, 1951, 1954], e: "Juin 1953. Pièges : 1950, leur arrestation ; 1951, leur condamnation ; 1949, la première bombe soviétique." },
    { t: "c", q: "Qui sont les « Cinq de Cambridge » ?", r: "Des Britanniques espions au service de l’URSS", p: ["Des physiciens du projet Manhattan passés à l’URSS", "Des agents de la CIA infiltrés au KGB", "Des savants allemands recrutés par les Anglais"], e: "Recrutés à l’université de Cambridge dans les années 1930, ils ont livré des secrets britanniques et américains aux Soviétiques." },
    { t: "c", q: "Pendant la Seconde Guerre mondiale, où les Britanniques déchiffrent-ils les codes allemands (Enigma) ?", r: "À Bletchley Park", p: ["À Los Alamos", "À Peenemünde", "À Cambridge"], e: "Bletchley Park, avec Alan Turing. Los Alamos : le laboratoire du projet Manhattan. Peenemünde : le centre allemand des fusées V2." },
    { t: "c", q: "Comment les États-Unis récupèrent-ils des savants allemands après 1945, comme Wernher von Braun ?", r: "Par l’opération Paperclip", p: ["Par le projet Manhattan", "Par le plan Marshall", "Par l’opération Overlord"], e: "Paperclip : plus de 1 500 scientifiques allemands recrutés. Von Braun conçoit ensuite la fusée Saturn V. Le plan Marshall est une aide économique à l’Europe ; Overlord, le débarquement de 1944." },
    { t: "c", q: "On parle de « circulation des cerveaux » plutôt que de « fuite » quand…", r: "Les diplômés partis font aussi profiter leur pays d’origine", p: ["Les diplômés quittent définitivement un pays pauvre", "Des étudiants viennent étudier sans jamais travailler", "Un pays interdit à ses chercheurs de partir"], e: "Retours, investissements, réseaux de la diaspora : l’Inde en est l’exemple type." },
    { t: "c", q: "Quelle ville est surnommée la « Silicon Valley de l’Inde » ?", r: "Bangalore", p: ["Bombay", "New Delhi", "Calcutta"], e: "Bangalore (Bengaluru), où se concentrent les entreprises du numérique, souvent fondées ou dirigées par des ingénieurs passés par les États-Unis." },
    { t: "c", q: "Que sont les IIT, en Inde ?", r: "Des écoles publiques d’ingénieurs très sélectives", p: ["Des entreprises de sous-traitance informatique", "Des universités américaines installées en Inde", "Des centres de recherche militaire secrets"], e: "Les Indian Institutes of Technology, créés à partir de 1951 : une élite d’ingénieurs, dont beaucoup partent aux États-Unis." }
  ],
  "hg-t6c": [
    { t: "c", q: "À quelle couche du cyberespace appartiennent les câbles sous-marins et les data centers ?", r: "La couche physique", p: ["La couche logique", "La couche informationnelle"], e: "Physique : câbles, serveurs, data centers. Logique : logiciels, protocoles. Informationnelle : données et contenus." },
    { t: "c", q: "À quelle couche du cyberespace appartiennent les logiciels et les protocoles d’internet ?", r: "La couche logique", p: ["La couche physique", "La couche informationnelle"], e: "Logique : ce qui fait fonctionner le réseau (logiciels, protocoles, noms de domaine)." },
    { t: "c", q: "Une campagne de fausses informations sur les réseaux sociaux vise quelle couche du cyberespace ?", r: "La couche informationnelle", p: ["La couche physique", "La couche logique"], e: "Informationnelle (ou sémantique) : les données et les contenus qui circulent." },
    { t: "c", q: "Pourquoi les câbles sous-marins sont-ils un enjeu de puissance ?", r: "Ils portent l’essentiel du trafic internet entre continents", p: ["Ils transportent l’essentiel de l’électricité mondiale", "Ils appartiennent tous à l’Union internationale des télécommunications", "Ils ne servent qu’aux communications militaires"], e: "Environ 99 % du trafic intercontinental : un risque d’espionnage et de sabotage. Les géants du numérique en posent désormais eux-mêmes." },
    { t: "d", q: "En quelle année l’Estonie subit-elle une cyberattaque massive attribuée à la Russie ?", r: 2007, p: [2004, 2005, 2008, 2010], e: "2007, après le déplacement d’un monument soviétique à Tallinn. Pièges : 2008, cyberattaques pendant la guerre en Géorgie ; 2010, Stuxnet révélé." },
    { t: "c", q: "Quelle cible vise le virus Stuxnet ?", r: "Le programme nucléaire iranien", p: ["Le réseau électrique ukrainien", "Les hôpitaux britanniques", "Les banques estoniennes"], e: "Stuxnet, attribué aux États-Unis et à Israël, sabote des centrifugeuses iraniennes. Le réseau électrique ukrainien est coupé fin 2015 ; les hôpitaux britanniques sont paralysés par WannaCry en 2017." },
    { t: "c", q: "NotPetya, en 2017, c’est…", r: "Un logiciel destructeur parti d’Ukraine qui frappe le monde entier", p: ["Le vol des données de millions d’utilisateurs de Facebook", "Le sabotage des centrifugeuses nucléaires iraniennes", "La coupure de câbles sous-marins en mer Baltique"], e: "Déguisé en rançongiciel, NotPetya détruit des données ; attribué à la Russie, il touche aussi de grandes entreprises (Maersk, Saint-Gobain…)." },
    { t: "d", q: "En quelle année est créée l’ANSSI ?", r: 2009, p: [2006, 2008, 2011, 2017], e: "2009. Piège : 2017, c’est le COMCYBER, le commandement de cyberdéfense des armées." },
    { t: "n", q: "Quelle agence française protège les systèmes informatiques de l’État et des opérateurs vitaux ?", r: "ANSSI", ok: ["Agence nationale de la sécurité des systèmes d’information"], p: ["CNIL", "DGSE", "COMCYBER", "DGSI"], e: "L’ANSSI. La CNIL protège les données personnelles ; la DGSE est le renseignement extérieur, la DGSI le renseignement intérieur ; le COMCYBER commande la cyberdéfense des armées." },
    { t: "d", q: "En quelle année est créé le COMCYBER, commandement de cyberdéfense des armées ?", r: 2017, p: [2009, 2015, 2018, 2019], e: "2017. Piège : 2019, c’est la doctrine française de lutte informatique offensive." },
    { t: "d", q: "En quelle année le RGPD entre-t-il en application ?", r: 2018, p: [2015, 2016, 2019, 2020], e: "Mai 2018. Piège : 2016, c’est son adoption." },
    { t: "c", q: "Qu’est-ce que l’ENISA ?", r: "L’agence de l’Union européenne pour la cybersécurité", p: ["Le centre d’excellence de l’OTAN pour la cyberdéfense", "L’agence nationale française pour la cybersécurité", "Le règlement européen sur la protection des données"], e: "L’ENISA dépend de l’UE. Le centre de l’OTAN est à Tallinn ; l’agence française, c’est l’ANSSI ; le règlement, c’est le RGPD." },
    { t: "c", q: "Quelle tension résume la cyberdéfense européenne ?", r: "Coopérer entre États tout en gardant sa souveraineté", p: ["Défendre l’UE en confiant tout à l’OTAN", "Protéger les données en interdisant internet", "Choisir entre la Chine et les États-Unis"], e: "Les États coopèrent (ENISA, RGPD) mais gardent la main sur leur défense et leur renseignement." }
  ],

  /* ---------------- PHILOSOPHIE : notions qui se ressemblent ---------------- */
  "ph-art": [
    { t: "c", q: "Pour Kant, en quoi le beau se distingue-t-il de l’agréable ?", r: "Le beau prétend plaire à tous ; l’agréable ne vaut que pour moi", p: ["Le beau est utile ; l’agréable ne sert strictement à rien", "Le beau se démontre ; l’agréable se ressent sans preuve", "Le beau vient de la nature ; l’agréable est fabriqué"], e: "L’agréable flatte mes sens (« à chacun son goût »). Le beau plaît sans concept, mais avec une prétention à valoir pour tous." },
    { t: "c", q: "« Est beau ce qui plaît universellement sans concept » : que veut dire « sans concept » ?", r: "On ne peut pas prouver la beauté par une règle", p: ["La beauté n’existe pas vraiment, c’est une illusion", "Seuls les experts savent juger ce qui est beau", "Une belle œuvre n’a pas besoin d’avoir un sens"], e: "On ne démontre pas qu’une chose est belle : on l’éprouve, tout en attendant que les autres soient d’accord." },
    { t: "c", q: "Qu’est-ce qui distingue l’œuvre d’art de l’objet technique ?", r: "L’œuvre n’a pas d’utilité : elle est faite pour être contemplée", p: ["L’œuvre est faite à la main, l’objet par une machine", "L’œuvre est unique, l’objet toujours fabriqué en série", "L’œuvre imite la nature, l’objet technique jamais"], e: "Le critère, c’est l’usage. Un objet artisanal peut être unique et fait main sans être une œuvre d’art." },
    { t: "c", q: "Pourquoi Platon voit-il dans l’art une « imitation d’une imitation » ?", r: "L’artiste copie des choses qui copient déjà les Idées", p: ["L’artiste copie d’autres artistes plutôt que la nature", "L’art imite la nature sans jamais l’égaler", "L’art reproduit des choses fausses pour tromper"], e: "Le peintre copie le lit du menuisier, qui copie l’Idée du lit : l’art est loin du vrai (La République, livre X)." }
  ],
  "ph-bonheur": [
    { t: "c", q: "Chez Épicure, quelle est la différence entre ataraxie et aponie ?", r: "Ataraxie : âme sans trouble ; aponie : corps sans douleur", p: ["Ataraxie : corps sans douleur ; aponie : âme sans trouble", "Ataraxie : plaisir intense ; aponie : absence de désir", "Ataraxie : indifférence ; aponie : refus du plaisir"], e: "Les deux ensemble font le bonheur épicurien : un plaisir en repos, pas une fête permanente." },
    { t: "c", q: "Selon Épicure, quels désirs faut-il satisfaire ?", r: "Les désirs naturels et nécessaires", p: ["Les désirs naturels, même non nécessaires", "Tous les désirs, avec modération", "Aucun : il faut tous les supprimer"], e: "Naturels et nécessaires : manger, boire, s’abriter. Naturels non nécessaires : mets raffinés. Ni naturels ni nécessaires : gloire, richesse (Lettre à Ménécée)." },
    { t: "c", q: "Pour les stoïciens, qu’est-ce qui dépend de nous ?", r: "Nos jugements et nos désirs", p: ["Notre santé et notre corps", "Notre réputation", "Notre richesse, si l’on travaille"], e: "Épictète : nos jugements, nos désirs, nos aversions dépendent de nous ; le corps, la réputation, les biens n’en dépendent pas." },
    { t: "c", q: "Pour Kant, la morale rend-elle heureux ?", r: "Non : elle rend digne d’être heureux", p: ["Oui : agir moralement suffit au bonheur", "Oui, si l’on agit par intérêt bien compris", "Non : morale et bonheur s’excluent"], e: "Le bonheur est « un idéal de l’imagination », impossible à définir. La morale ne le garantit pas : elle nous en rend dignes." },

  "ph-conscience": [

    { t: "c", q: "La conscience morale, c’est…", r: "La capacité de juger le bien et le mal de ses actes", p: ["Le simple fait de savoir que l’on existe", "La perception de tout ce qui nous entoure", "Le souvenir de nos actions passées"], e: "À ne pas confondre avec la conscience psychologique : savoir ce que l’on vit, que l’on existe." },
    { t: "c", q: "« Toute conscience est conscience de quelque chose » (Husserl) signifie que…", r: "La conscience est toujours tournée vers un objet", p: ["La conscience se connaît d’abord elle-même", "On n’a conscience que des choses matérielles", "La conscience n’est faite que de souvenirs"], e: "C’est l’intentionnalité. Piège : se connaître d’abord soi-même, c’est plutôt l’idée du cogito de Descartes." },
    { t: "c", q: "Pourquoi le cogito est-il une certitude pour Descartes ?", r: "Même en doutant de tout, je ne peux douter que je pense", p: ["Mes sens ne me trompent jamais sur moi-même", "Dieu me l’a révélé avant tout raisonnement", "Tout le monde en a fait l’expérience"], e: "Douter, c’est penser ; penser, c’est être. « Je pense, donc je suis » (1637)." }

  "ph-devoir": [

    { t: "c", q: "Pour Kant, qu’est-ce qui donne sa valeur morale à une action ?", r: "L’intention : agir par respect pour la loi morale", p: ["Ses conséquences heureuses pour le plus grand nombre", "Sa conformité à la loi de l’État", "Le plaisir qu’elle procure à celui qui agit"], e: "Piège : juger une action par ses conséquences, c’est l’utilitarisme (Bentham, Mill), pas Kant." },

  "ph-etat": [

  "ph-inconscient": [

  "ph-justice": [

  "ph-langage": [

  "ph-liberte": [

  "ph-nature": [

class Chrono {

/* ---------- Séances et minutes ---------- */

}

/* ---------- Séance en blocs : 25 min de travail, 5 min de pause ----------
   Montée sur 3 semaines : 2 blocs, puis 3, puis 4 (1 h 55 avec les pauses).
   4 blocs = HGGSP apprendre · HGGSP s’entraîner · HGGSP exercice type bac · philo. */
const DUREE_BLOC = 25, DUREE_PAUSE = 5;
const debutBlocs = () => (S.config.rythme || {}).debut || todayKey();
function nbBlocsDuJour(d) {
  const mode = (S.config.rythme || {}).mode;
  if ([2, 3, 4].includes(mode)) return mode;
  const j = daysBetween(debutBlocs(), d || todayKey());
  return j < 7 ? 2 : j < 14 ? 3 : 4;
}
function semaineMontee(d) {
  if ((S.config.rythme || {}).mode !== "montee") return null;
  return clamp(Math.floor(daysBetween(debutBlocs(), d || todayKey()) / 7) + 1, 1, 3);
}
const dureeSeance = (nb) => nb * DUREE_BLOC + Math.max(0, nb - 1) * DUREE_PAUSE;
// avant le passage aux blocs, chaque jour garde l’ancien objectif en minutes
const objectifDuJour = (d) => { d = d || todayKey(); return d < debutBlocs() ? S.config.objectif : nbBlocsDuJour(d) * DUREE_BLOC; };
const libelleBlocs = (nb) => `${pluriel(nb, "bloc")} de ${DUREE_BLOC} min`;
function blocsFaitsDuJour(d) {

const ROLES_BLOC = {

// Un bloc = une file d’activités, puis des révisions en boucle jusqu’à la fin des 25 min
function planSeance(nb) {
  nb = nb || nbBlocsDuJour();
  const X = epreuveActive("hggsp") ? chapitreDuSoirMat("hggsp") : null;
  const P = epreuveActive("philo") ? chapitreDuSoirMat("philo") : null;
  const autres = (mat, ch, n) => classementMat(mat).filter((c) => !ch || c.id !== ch.id).slice(0, n).map((c) => c.id);
  const revH = X ? [X.id, ...autres("hggsp", X, 2)] : [];
  const revP = P ? [...new Set([P.id, ...autres("philo", P, 1), ...(CHAP["ph-reperes"] ? ["ph-reperes"] : [])])] : [];
  const Y = revH[1] || (X && X.id);
  const bloc = (role, mat, chap, file, revisions) => ({ role, mat, chap, file, revisions, titre: `${MATIERES[mat].nom} · ${ROLES_BLOC[role].nom}` });
  const A = () => bloc("apprendre", "hggsp", X.id, [["dues"], ["cartes", X.id], ["explique", X.id], ["quiz", X.id]], revH);
  const E = () => bloc("entrainer", "hggsp", X.id, [["dues"], ["erreurs"], ["quiz", X.id], ["quiz", Y], ["explique", Y]], [Y, ...revH]);
  const B = () => bloc("bac", "hggsp", X.id, [["exercice", X.id]], revH);
  const EB = () => bloc("entrainerBac", "hggsp", X.id, [["erreurs"], ["quiz", X.id], ["exercice", X.id]], revH);
  const H2 = () => bloc("hggsp2", "hggsp", X.id, [["dues"], ["cartes", X.id], ["quiz", X.id], ["explique", X.id]], revH);
  const Ph = () => bloc("philo", "philo", P.id, [["dues"], ["cartes", P.id], ["quiz", P.id], ["explique", P.id], ...(maitriseDe(P.id) >= 2 ? [["exercice", P.id]] : [])], revP);
  let blocs = [];
  if (X && P) blocs = nb >= 4 ? [A(), E(), B(), Ph()] : nb === 3 ? [A(), EB(), Ph()] : nb === 2 ? [H2(), Ph()] : [E()];
  else if (X) blocs = (nb === 1 ? [E()] : [A(), E(), B(), E()]).slice(0, nb);
  else if (P) blocs = Array.from({ length: nb }, Ph);
  return { nb: blocs.length, blocs, chapH: X, chapP: P, duree: dureeSeance(blocs.length) };
}

        corriger(juste, exact);
      };
      bPasse.addEventListener("click", () => terminer(false, false, ""));
      const form = h("form", { class: "pile", novalidate: true, onsubmit: (e) => {
        e.preventDefault();
        if (champ.disabled) return;
        const res = corrigerSaisie(x, champ.value);
        if (res.vide) { toast("Écris ta réponse, ou touche « Je ne sais pas »."); champ.focus(); return; }
        terminer(res.juste, res.exact, champ.value.trim());
      } }, h("label", { class: "champ", for: "rep-quiz" }, x.t === "d" ? "L’année" : "Le nom", champ), h("div", { class: "rangee etire" }, bPasse, bValider));
      zone.append(form, expl);
      setTimeout(() => { try { champ.focus({ preventScroll: true }); } catch (e) { /* ignoré */ } }, 60);
    };
    const aRetenir = (x) => { const r = String(x.r); return !x.e ? r : x.e.includes(r) ? x.e : `${r} — ${x.e}`; };
    const finir = () => {
      const n = questions.length;
      const ecrites = questions.filter((q) => q.ecrit).length;
      const coches = ratees.map((q) => ({ q, ok: true }));
      vider(zone).append(
        h("div", { class: "tampon-zone" },
          h("div", { class: "tampon" + (score >= n * 0.7 ? " bleu" : "") }, `${score} / ${n}`),
          h("p", null, score === n ? "Sans faute." : score >= n * 0.7 ? "Solide. Les ratées reviendront en premier au prochain quiz." : "Pas encore su. Les ratées reviendront en premier au prochain quiz."),
          passages ? h("p", { class: "sous" }, `${pluriel(passages, "question")} ${passages > 1 ? "passent" : "passe"} à l’écrit : au prochain quiz, plus de propositions.`) : null),
        ratees.length ? h("div", { class: "carte" }, h("h3", { class: "h2" }, "Ajouter tes erreurs au carnet ?"),
          ...coches.map((c) => h("label", { class: "case" }, h("input", { type: "checkbox", checked: true, onchange: (e) => { c.ok = e.target.checked; } }),
            h("span", null, c.q.x.q, h("span", { class: "petit", style: "display:block" }, "Réponse : " + c.q.x.r))))) : null,
        h("button", { class: "btn grand primaire", type: "button", onclick: () => {
          coches.filter((c) => c.ok).forEach((c) => ajouterErreur({ mat: ch.mat, chap: c.q.x.chap || ch.id, type: "cours", description: c.q.x.q, aRetenir: aRetenir(c.q.x), source: "quiz" }));
          ctx.fini({ type: "quiz", chap: ch.id, n, ok: score, resume: `Quiz ${score}/${n}${ecrites ? ` · ${ecrites} à l’écrit` : ""}` });
        } }, ctx.libelleSuite || "Terminer"));
    };
    afficher();
  }

  if (p.direct) { lancer(); return; } // dans un bloc de la séance : pas d’écran d’accueil
  const qs = questionsDuChap(ch.id);
  const st = statsQuiz([ch.id]);
  const avecEcrit = qs.some((x) => x.t === "d" || x.t === "n");
  const nb = Math.min(tailleQuiz(ch.id), qs.length + (appointQuiz(ch.id) ? questionsDuChap(appointQuiz(ch.id)).length : 0));
  vider(zone).append(
    h("div", { class: "sujet" }, h("div", { class: "petit" }, MATIERES[ch.mat].nom), h("div", { class: "t" }, ch.court)),
    h("p", null, `${nb} questions à pièges : ${pieges}.`),
    avecEcrit ? h("p", { class: "sous" }, "Une date ou un nom trouvé deux fois de suite revient sans propositions : il faudra l’écrire toi-même.") : null,
    st.vues ? h("p", { class: "petit" }, `${st.maitrisees}/${st.total} questions maîtrisées${avecEcrit ? ` · ${st.ecrire} à écrire sans aide` : ""}`) : null,
    h("div", { class: "pile" },
      h("button", { class: "btn grand primaire", type: "button", onclick: lancer }, icone("quiz"), "Lancer le quiz"),
      S.ia ? h("button", { class: "btn grand", type: "button", onclick: lancerIA }, icone("ia"), "Quiz préparé par Claude") : null)
  );
}

/* ---------- Exercice type bac ---------- */
function actExercice(zone, p, ctx) {
  const ch = CHAP[p.chap];
  const typesPossibles = Object.entries(EXERCICES).filter(([, x]) => x.mat === ch.mat);
  let typeId = p.exo && EXERCICES[p.exo] && EXERCICES[p.exo].mat === ch.mat ? p.exo : null;
  const etat = { sujet: null, document: "", reponse: "", questionsJury: null };

  const choisirType = () => {
    vider(zone).append(h("p", null, "Quel entraînement ?"),
      h("div", { class: "pile" }, typesPossibles.map(([id, x]) => h("button", { class: "btn grand", type: "button", style: "justify-content:flex-start;text-align:left", onclick: () => { typeId = id; choisirSujet(); } },
        h("span", { class: "pile", style: "gap:2px" }, h("b", null, x.nom), h("span", { class: "petit" }, `${x.desc} Environ ${x.duree} min.`))))));
  };

  const choisirSujet = () => {
    const x = EXERCICES[typeId];
    if (typeId === "go-jury") return preparerGO();
    if (x.besoinDoc) return travailler({ texte: x.mat === "philo" ? "Explique ce texte." : "Étude critique du document choisi.", source: "doc" });
    const banque = ch.sujets.filter((s) => s.type === x.sujetType);
    const autres = CHAPITRES.filter((c) => c.mat === ch.mat && c.id !== ch.id && c.bac).flatMap((c) => c.sujets.filter((s) => s.type === x.sujetType).map((s) => ({ ...s, chap: c.id })));
    const genererIA = async () => {
      vider(zone).append(chargement("Claude choisit un sujet…"));
      const prompt = `Tu es professeur de ${MATIERES[ch.mat].long} en terminale générale (bac 2027, programme officiel français). Propose UN sujet de type « ${x.nom} » sur le chapitre « ${ch.titre} », dans le style des sujets du bac, différent de : ${banque.map((s) => s.texte).join(" / ") || "aucun"}.
Donne aussi 3 à 5 attendus précis (ce qu’un correcteur veut voir).
Réponds uniquement avec un objet JSON valide : {"sujet":"...","attendus":["...","..."]}`;
      try {
        const r = await demanderJSON(prompt);
        if (!r.sujet) throw { code: "format" };
        travailler({ texte: String(r.sujet), attendus: (r.attendus || []).map(String), source: "ia" });
      } catch (e) { vider(zone).append(bandeau("alerte", messageErreurIA(e))); choixSujets(); }
    };
    const choixSujets = () => {
      zone.append(
        h("p", null, h("b", null, x.nom), " · choisis un sujet"),
        h("div", { class: "pile" },
          banque.map((s) => h("button", { class: "btn", type: "button", style: "justify-content:flex-start;text-align:left", onclick: () => travailler({ texte: s.texte, source: "banque" }) }, s.texte)),
          S.ia ? h("button", { class: "btn primaire", type: "button", onclick: genererIA }, icone("ia"), "Un nouveau sujet préparé par Claude") : null,
          autres.length ? h("details", { class: "repli" }, h("summary", null, "Sujets d’autres chapitres"),
            h("div", { class: "pile" }, autres.map((s) => h("button", { class: "btn petit-btn", type: "button", style: "justify-content:flex-start;text-align:left", onclick: () => travailler({ texte: s.texte, source: "banque", chap: s.chap }) }, `${CHAP[s.chap].court} — ${s.texte}`)))) : null));
    };
    vider(zone);
    if (!banque.length && S.ia) return genererIA();
    choixSujets();
  };

  const preparerGO = () => {
    const qs = (S.config.questionsGO || []).filter((q) => q && q.trim());
    vider(zone);
    if (!qs.length) {
      zone.append(bandeau("info", "Ajoute d’abord tes deux questions de grand oral dans l’onglet Plus (rubrique Grand oral). En attendant, voici des questions générales du jury."));
      return travaillerGO("Ma question de grand oral", null);
    }
    zone.append(h("p", null, "Sur quelle question tu t’entraînes ?"),
      h("div", { class: "pile" }, qs.map((q) => h("button", { class: "btn", type: "button", style: "justify-content:flex-start;text-align:left", onclick: () => travaillerGO(q, true) }, q))));
  };
  const QUESTIONS_JURY = [
    "Pourquoi as-tu choisi cette question ?",
    "Peux-tu définir précisément les termes de ta question ?",
    "Quel exemple concret illustre le mieux ta réponse ?",
    "Quelle est la principale limite de ton raisonnement ?",
    "Quel lien fais-tu entre cette question et tes deux spécialités ?",
    "Que veux-tu faire après le bac, et pourquoi ?"
  ];
  const travaillerGO = async (question, avecIA) => {
    let questions = QUESTIONS_JURY;
    if (avecIA && S.ia) {
      vider(zone).append(chargement("Claude joue le jury…"));
      try {
        const r = await demanderJSON(`Tu es membre du jury du grand oral du bac général 2027 (spécialité HGGSP et une autre spécialité). Le candidat présente la question : « ${question} ». Pose 6 questions que poserait un jury bienveillant mais exigeant pendant l’échange de 10 minutes : précision des notions, exemples, limites, liens entre les spécialités, et une question sur son projet après le bac.
Réponds uniquement avec un objet JSON valide : {"questions":["...","..."]}`);
        if (Array.isArray(r.questions) && r.questions.length) questions = r.questions.map(String).slice(0, 8);
      } catch (e) { toast(messageErreurIA(e)); }
    }
    travailler({ texte: question, source: "go", questionsJury: questions });
  };

  const travailler = (sujet) => {
    etat.sujet = sujet;
    const x = EXERCICES[typeId];
    const ta = h("textarea", { class: "copie", id: "reponse-exo", placeholder: typeId === "go-jury" ? "Pour chaque question : l’idée clé de ta réponse en une phrase." : "Écris ta réponse ici, comme sur ta copie.", value: etat.reponse, oninput: (e) => { etat.reponse = e.target.value; compte.textContent = `${(etat.reponse.trim().match(/\S+/g) || []).length} mots`; } });
    const apercu = h("div", { class: "dicte", "aria-live": "polite" });
    const compte = h("span", { class: "petit tnum" }, "0 mots");
    const docZone = x.besoinDoc ? h("label", { class: "champ" }, x.mat === "philo" ? "Le texte à expliquer" : "Le document et sa consigne",
      h("span", { class: "aide" }, "Recopie-le ou colle-le (avec l’auteur et la date)."),
      h("textarea", { id: "doc-exo", value: etat.document, oninput: (e) => { etat.document = e.target.value; } })) : null;
    const methode = METHODES.find((m) => m.mat === ch.mat && (typeId.includes("dissert") ? m.id.includes("dissert") : typeId.includes("etude") ? m.id.includes("etude") : typeId.includes("explication") ? m.id.includes("texte") : m.id === "m-go"));
    vider(zone).append(
      h("div", { class: "sujet" }, h("div", { class: "petit" }, `${MATIERES[ch.mat].nom} · ${x.nom} · environ ${x.duree} min`), h("div", { class: "t" }, sujet.texte)),
      sujet.questionsJury ? h("div", { class: "carte" }, h("h3", { class: "h2" }, "Les questions du jury"), h("ol", { style: "margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px" }, sujet.questionsJury.map((q) => h("li", null, q)))) : null,
      h("p", null, x.consigne),
      methode ? h("details", { class: "repli" }, h("summary", null, "Rappel de méthode"), h("ol", null, methode.etapes.map(([t, d]) => h("li", null, h("b", null, t), " — ", d)))) : null,
      docZone,
      h("label", { class: "champ", for: "reponse-exo" }, "Ta réponse"), ta,
      h("div", { class: "rangee", style: "justify-content:space-between" }, boutonMicro(ta, apercu), compte), apercu,
      h("div", { class: "pile" },
        S.ia ? h("button", { class: "btn grand primaire", type: "button", onclick: () => corrigerIA() }, icone("ia"), "Faire corriger par Claude") : null,
        h("button", { class: "btn grand" + (S.ia ? "" : " primaire"), type: "button", onclick: () => autoCorriger() }, icone("coche"), "Je m’auto-corrige"))
    );
  };

  const corrigerIA = async () => {
    const x = EXERCICES[typeId];
    if (etat.reponse.trim().length < 40) { toast("Écris d’abord une vraie réponse (quelques phrases au moins)."); return; }
    vider(zone).append(chargement("Claude corrige ta copie…"));
    const prompt = `Tu es correcteur du bac général français, session 2027, en ${MATIERES[ch.mat].long}. Exercice : « ${x.nom} ». ${x.consigne}
Chapitre : « ${ch.titre} ».
Sujet : « ${etat.sujet.texte} ».
${etat.sujet.attendus ? "Attendus : " + etat.sujet.attendus.join(" ; ") + "." : ""}
${etat.document ? "Document / texte fourni par l’élève : «« " + etat.document.slice(0, 6000) + " »»" : ""}
${etat.sujet.questionsJury ? "Questions du jury : " + etat.sujet.questionsJury.join(" / ") : ""}
Copie de l’élève : «« ${etat.reponse.slice(0, 12000)} »»
Corrige comme un vrai correcteur : franc, précis et exigeant, sans méchanceté. Tutoie l’élève. Tiens compte de la maîtrise de la langue (au moins 2 points sur 20 en 2027). Ne réécris pas sa copie.
Donne une note sur 20 correspondant au niveau de ce travail pour cet exercice, 2 à 4 points forts, 2 à 4 points à améliorer, les erreurs précises (type parmi : ${ERREUR_TYPES.map((t) => t.id).join(", ")}), une phrase de conseil pour la prochaine fois et un exemple de phrase réussie.
Réponds uniquement avec un objet JSON valide : {"note":12,"points_forts":["..."],"a_ameliorer":["..."],"erreurs":[{"type":"cours","description":"...","a_retenir":"..."}],"conseil":"...","exemple":"..."}`;
    try {
      const r = await demanderJSON(prompt, "complex");
      if (typeof r.note !== "number" && typeof r.note !== "string") throw { code: "format" };
      afficherRetour({ note: clamp(Number(String(r.note).replace(",", ".")) || 0, 0, 20), forts: (r.points_forts || []).map(String), ameliorer: (r.a_ameliorer || []).map(String),
        erreurs: (r.erreurs || []).filter((e) => e && e.description).map((e) => ({ type: ERREUR_TYPES.some((t) => t.id === e.type) ? e.type : "cours", description: String(e.description), aRetenir: String(e.a_retenir || "") })),
        conseil: r.conseil ? String(r.conseil) : "", exemple: r.exemple ? String(r.exemple) : "", source: "ia" });
    } catch (e) {

          h("button", { class: "btn", type: "button", onclick: () => autoCorriger() }, "M’auto-corriger"),
          h("button", { class: "btn fantome", type: "button", onclick: () => travailler(etat.sujet) }, "Revenir à ma copie")));

  const autoCorriger = () => {
    const x = EXERCICES[typeId];

    const noteEl = h("output", { class: "tnum", style: "font-weight:700" }, "10");
    vider(zone).append(
      h("div", { class: "sujet" }, h("div", { class: "t" }, etat.sujet.texte)),

      h("label", { class: "champ" }, "Ta note estimée sur 20", h("input", { type: "range", min: "0", max: "20", step: "1", value: "10", oninput: (e) => { noteAuto = Number(e.target.value); noteEl.textContent = e.target.value; } }), noteEl),

      } }, "Valider mon auto-correction"));
  };

  const afficherRetour = (ret) => {
    const choix = ret.erreurs.map((e) => ({ e, ok: true }));
    vider(zone).append(
      h("div", { class: "retour" },
        h("div", { class: "rangee", style: "justify-content:space-between" }, h("span", { class: "note" }, `${fmtNote(ret.note)}/20`), h("span", { class: "puce" }, ret.source === "ia" ? "Corrigé par Claude" : "Auto-correction")),
        ret.forts.length ? h("div", null, h("h3", null, "Points forts"), h("ul", null, ret.forts.map((t) => h("li", null, t)))) : null,
        ret.ameliorer.length ? h("div", null, h("h3", null, "À améliorer"), h("ul", null, ret.ameliorer.map((t) => h("li", null, t)))) : null,
        ret.conseil ? bandeau("info", h("b", null, "Pour la prochaine fois : "), ret.conseil) : null,
        ret.exemple ? h("div", { class: "sujet" }, h("div", { class: "petit" }, "Exemple de phrase réussie"), h("p", null, ret.exemple)) : null),
      choix.length ? h("div", { class: "carte" }, h("h3", { class: "h2" }, "Ajouter au carnet d’erreurs"),
        choix.map((c) => h("label", { class: "case" }, h("input", { type: "checkbox", checked: true, onchange: (ev) => { c.ok = ev.target.checked; } }),
          h("span", null, h("b", null, typeErreur(c.e.type).nom + " · "), c.e.description, c.e.aRetenir ? h("span", { class: "petit", style: "display:block" }, "À retenir : " + c.e.aRetenir) : null)))) : null,
      h("button", { class: "btn grand primaire", type: "button", onclick: () => {
        choix.filter((c) => c.ok).forEach((c) => ajouterErreur({ ...c.e, mat: ch.mat, chap: etat.sujet.chap || ch.id, source: "exercice" }));
        Store.ecrire("exercices", uid(), { date: todayKey(), chap: etat.sujet.chap || ch.id, mat: ch.mat, type: typeId, sujet: etat.sujet.texte, reponse: etat.reponse.slice(0, 20000), document: etat.document.slice(0, 8000), note: ret.note, source: ret.source, forts: ret.forts, ameliorer: ret.ameliorer, conseil: ret.conseil });
        ctx.fini({ type: "exercice", chap: etat.sujet.chap || ch.id, note: ret.note, resume: `${EXERCICES[typeId].nom} · ${fmtNote(ret.note)}/20` });
      } }, ctx.libelleSuite || "Enregistrer et terminer"));
  };

  if (!typeId) choisirType(); else choisirSujet();
}

/* ---------- Explique-le ---------- */
function actExplique(zone, p, ctx) {
  const ch = CHAP[p.chap];
  const candidates = cartesDuChap(ch.id);
  const ordre = melanger(candidates).sort((a, b) => ((S.progres.get(a.id) || {}).boite || 0) - ((S.progres.get(b.id) || {}).boite || 0));
  let idx = 0, n = 0, total = 0;
  const suivant = () => {
    const c = ordre[idx % ordre.length]; idx++;
    let texte = "";
    const ta = h("textarea", { id: "explique-txt", placeholder: "3 à 6 phrases, avec un exemple.", oninput: (e) => { texte = e.target.value; } });
    const apercu = h("div", { class: "dicte", "aria-live": "polite" });
    vider(zone).append(
      h("div", { class: "flash" }, h("div", { class: "petit" }, "Explique avec tes mots, comme à quelqu’un qui n’a jamais fait de " + MATIERES[ch.mat].nom), h("div", { class: "q" }, c.recto)),
      h("label", { class: "champ", for: "explique-txt" }, "Ton explication"), ta, h("div", { class: "rangee" }, boutonMicro(ta, apercu)), apercu,
      h("div", { class: "pile" },
        S.ia ? h("button", { class: "btn grand primaire", type: "button", onclick: () => verifierIA(c, texte) }, icone("ia"), "Vérifier avec Claude") : null,
        h("button", { class: "btn grand" + (S.ia ? "" : " primaire"), type: "button", onclick: () => comparer(c) }, "Comparer avec la carte")));
  };
  const noter = (c, niveau) => { repondreCarte(c, niveau >= 2); n++; total += niveau; };
  const apres = () => h("div", { class: "rangee etire" },
    h("button", { class: "btn", type: "button", onclick: suivant }, "Une autre notion"),
    h("button", { class: "btn primaire", type: "button", onclick: () => ctx.fini({ type: "explique", chap: ch.id, n, moyenne: n ? total / n : 0, resume: `${pluriel(n, "notion")} expliquée${n > 1 ? "s" : ""}` }) }, ctx.libelleSuite || "Terminer"));
  const comparer = (c) => {
    vider(zone).append(h("div", { class: "flash" }, h("div", { class: "q" }, c.recto), h("div", { class: "r" }, c.verso)),
      h("p", null, "Ton explication contenait l’essentiel ?"),
      h("div", { class: "segment" }, NIVEAUX_EXPLIQUE.map((lab, k) => h("button", { type: "button", "data-m": String(k), onclick: () => { noter(c, k); vider(zone).append(h("div", { class: "tampon-zone" }, h("div", { class: "tampon bleu" }, lab)), apres()); } }, h("span", { class: "pt" }), lab))));
  };
  const verifierIA = async (c, texte) => {
    if (texte.trim().length < 20) { toast("Écris au moins deux phrases avant de vérifier."); return; }
    vider(zone).append(chargement("Claude lit ton explication…"));
    try {
      const r = await demanderJSON(`Tu es professeur de ${MATIERES[ch.mat].long} en terminale (bac 2027). Un élève explique la notion « ${c.recto} ». Définition de référence : « ${c.verso} ».
Explication de l’élève : «« ${texte.slice(0, 4000)} »»
Évalue sa compréhension. Niveau : 0 = à côté, 1 = partiel, 2 = bien, 3 = parfait. Tutoie l’élève, sois franc et bref.
Réponds uniquement avec un objet JSON valide : {"niveau":2,"juste":["..."],"manque":["..."],"faux":["..."],"version_courte":"la bonne explication en 2 phrases simples"}`);
      const niveau = clamp(parseInt(r.niveau, 10) || 0, 0, 3);
      noter(c, niveau);
      const liste = (t, arr) => arr && arr.length ? h("div", null, h("h3", null, t), h("ul", null, arr.map((x) => h("li", null, String(x))))) : null;
      vider(zone).append(h("div", { class: "retour" },
        h("div", { class: "tampon-zone" }, h("div", { class: "tampon" + (niveau >= 2 ? " bleu" : "") }, NIVEAUX_EXPLIQUE[niveau])),

/* ---------- Activité seule (depuis Réviser ou un chapitre) ---------- */
function ouvrirActivite(type, params) {

  const ctxAct = { chrono, fini: null, libelleSuite: null, surNettoyage: null };
  ouvrirFeuille({
    titre: TITRES_ACT[type] + (p.chap ? " · " + CHAP[p.chap].court : ""),
    avantFermeture: async () => {
      if (fini) return true;

      if (min >= 1) {
        const v = await dialogue({ titre: "Arrêter l’activité ?", texte: `Tu as travaillé ${fmtMin(min)}. Ce temps sera enregistré.`, boutons: [{ label: "Arrêter et enregistrer", valeur: "oui", cls: "primaire" }, { label: "Continuer", valeur: "non" }] });

   25 min de travail · 5 min de pause · 25 min… Un bloc ne s’arrête
   pas quand une activité finit : l’appli enchaîne la suivante jusqu’au
   bout des 25 minutes. La séance est enregistrée après chaque bloc et

const cleSeance = () => "carnet.seance." + (CLE_CARNET || "local");

  try {

    if (!e || e.v !== 1 || e.phase === "fini" || e.phase === "avant") return null;
    if (e.date !== todayKey() && Date.now() - (e.maj || 0) > 6 * 3600000) return null; // séance d’un autre jour

  } catch (er) { return null; }

/* Petit signal sonore (et vibration sur Android) à la fin d’un bloc et d’une pause */
let sonCtx = null;
function preparerSon() {
  try { if (!sonCtx) sonCtx = new (window.AudioContext || window.webkitAudioContext)(); if (sonCtx.state === "suspended") sonCtx.resume(); } catch (e) { sonCtx = null; }
}

  try { if (navigator.vibrate) navigator.vibrate([220, 120, 220]); } catch (e) { /* ignoré */ }
  if (!sonCtx || document.hidden) return;
  try {
    const t = sonCtx.currentTime;
    for (let k = 0; k < (n || 2); k++) {
      const o = sonCtx.createOscillator(), g = sonCtx.createGain(), t0 = t + k * 0.35;
      o.frequency.value = 880; o.connect(g); g.connect(sonCtx.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.start(t0); o.stop(t0 + 0.3);
    }
  } catch (e) { /* ignoré */ }
}

function lancerSoiree(opts) {
  opts = opts || {};
  if (S.lectureSeule) { toast("Lecture seule : tu ne peux pas lancer de séance avec ce compte."); return; }
  let etat = opts.reprise || null;
  if (!etat) {

    const bonus = !!opts.bonus || faits >= nb;
    const plan = planSeance(bonus ? 1 : nb);
    const blocs = bonus ? plan.blocs : plan.blocs.slice(Math.min(faits, plan.blocs.length - 1));
    if (!blocs.length) { toast("Aucune matière à réviser : coche tes épreuves dans l’onglet Plus."); return; }
    if (!(S.config.rythme || {}).debut) majConfig({ rythme: Object.assign({}, S.config.rythme, { debut: todayKey() }) });
    etat = {
      v: 1, id: uid(), date: todayKey(), debut: Date.now(), maj: Date.now(), bonus,
      plan: { nb: blocs.length, blocs }, iBloc: 0, phase: "avant", iFile: 0, kRempl: 0,
      msBlocs: [], msEnCours: 0, pauses: [], pauseDebut: null, resultats: [],

  const ecrire = (extra) => {

  const dd = new Date(t0); dd.setDate(1);
  while (dd.getTime() <= t1) { const k = dateKey(dd); if (dd.getTime() >= t0) svg.append(sv("text", { x: x(k), y: H - 6, "text-anchor": "middle" }, MOIS_C[dd.getMonth()])); dd.setMonth(dd.getMonth() + 1); }
  const couleurs = { ses: "var(--s-ses)", hggsp: "var(--s-hggsp)", philo: "var(--s-philo)" };
  const b = bulle(el);
  const fins = [];
  for (const mat of mats) {
    const pts = notes.filter((n) => n.mat === mat).map((n) => ({ n, v: (n.valeur / (n.sur || 20)) * 20 }));
    if (!pts.length) continue;
    if (leg) leg.append(h("span", null, h("span", { class: "kl", style: `background:${couleurs[mat]}` }), `${MATIERES[mat].long} · moyenne ${fmtNote(moyenneMatiere(mat))}`));
    if (pts.length > 1) svg.append(sv("path", { d: pts.map((p, i) => `${i ? "L" : "M"}${x(p.n.date).toFixed(1)},${y(p.v).toFixed(1)}`).join(" "), fill: "none", stroke: couleurs[mat], "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    for (const p of pts) {
      svg.append(sv("circle", { cx: x(p.n.date), cy: y(p.v), r: 4, fill: couleurs[mat], stroke: "var(--feuille)", "stroke-width": 2 }));
      const zone = sv("circle", { cx: x(p.n.date), cy: y(p.v), r: 12, fill: "transparent", style: "cursor:pointer" });
      const montrer = () => b.montrer(x(p.n.date), y(p.v), h("b", null, `${fmtNote(p.n.valeur)}/${p.n.sur || 20}`), h("div", null, h("span", { class: "k", style: `background:${couleurs[mat]}` }), `${MATIERES[mat].nom} · ${p.n.type || "note"} · ${fmtDateCourte(p.n.date)}`));

    fins.push({ y: y(der.v), x: x(der.n.date), txt: `${MATIERES[mat].nom} ${fmtNote(der.v)}` });
  }
  fins.sort((a, c) => a.y - c.y);
  const ecartOk = fins.every((f, i) => i === 0 || f.y - fins[i - 1].y >= 14);
  if (ecartOk) for (const f of fins) svg.append(sv("text", { x: Math.min(f.x + 8, W - m.r + 6), y: f.y + 4, class: "lab-fort" }, f.txt));
  el.prepend(svg);
}
function grapheErreurs(el) {
  vider(el);
  const errs = [...S.erreurs.values()];
  const rows = ERREUR_TYPES.map((t) => ({ t, n: errs.filter((e) => e.type === t.id).length })).filter((r) => r.n).sort((a, b) => b.n - a.n);
  const W = Math.max(280, el.clientWidth || 400);
  const lw = Math.min(200, Math.round(W * 0.46));
  const rh = 30, H = rows.length * rh + 6;
  const max = Math.max(...rows.map((r) => r.n));
  const x0 = lw + 8, x1 = W - 34;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  svg.append(sv("line", { x1: x0, x2: x0, y1: 0, y2: H, stroke: "var(--axe)", "stroke-width": 1 }));
  rows.forEach((r, i) => {
    const yc = i * rh + rh / 2 + 3;
    const w = Math.max(3, ((x1 - x0) * r.n) / max);
    const r4 = Math.min(4, w / 2);
    svg.append(sv("text", { x: lw, y: yc + 4, "text-anchor": "end", class: "lab-fort" }, r.t.nom.length > 28 && W < 420 ? r.t.nom.slice(0, 26) + "…" : r.t.nom));
    svg.append(sv("path", { d: `M${x0},${yc - 7} H${x0 + w - r4} Q${x0 + w},${yc - 7} ${x0 + w},${yc - 7 + r4} V${yc + 7 - r4} Q${x0 + w},${yc + 7} ${x0 + w - r4},${yc + 7} H${x0} Z`, fill: "var(--barre)" }));
    svg.append(sv("text", { x: x0 + w + 6, y: yc + 4, class: "tnum" }, String(r.n)));
  });
  el.prepend(svg);
}
